<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忘记密码 · 书签</title>
  <script src="js/md5.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #f0f2f8;
      --bg-orb1:      rgba(99,102,241,0.18);
      --bg-orb2:      rgba(6,182,212,0.14);
      --bg-orb3:      rgba(139,92,246,0.10);
      --brand-bg:     linear-gradient(145deg, rgba(99,102,241,0.12) 0%, rgba(6,182,212,0.07) 100%);
      --brand-border: rgba(99,102,241,0.12);
      --form-bg:      rgba(255,255,255,0.92);
      --form-border:  rgba(0,0,0,0.06);
      --card-shadow:  0 24px 64px rgba(99,102,241,0.12), 0 0 0 1px rgba(0,0,0,0.06);
      --text:         #1a1a2e;
      --text-sub:     #5a5a7a;
      --text-muted:   #9090b0;
      --input-bg:     #f4f5fb;
      --input-border: rgba(0,0,0,0.10);
      --input-focus:  #6366f1;
      --input-color:  #1a1a2e;
      --placeholder:  #b0b0cc;
      --icon-color:   #a0a0c0;
      --grad:         linear-gradient(135deg, #6366f1, #06b6d4);
      --accent:       #6366f1;
      --link:         #6366f1;
      --link-hover:   #4f46e5;
      --error-bg:     rgba(244,63,94,0.08);
      --error-border: rgba(244,63,94,0.18);
      --error-text:   #e11d48;
      --success-bg:   rgba(16,185,129,0.08);
      --success-border:rgba(16,185,129,0.20);
      --success-text: #059669;
      --qbox-bg:      rgba(99,102,241,0.05);
      --qbox-border:  rgba(99,102,241,0.12);
      --qbox-label:   #6366f1;
      --toggle-bg:    rgba(0,0,0,0.06);
      --toggle-hover: rgba(0,0,0,0.10);
      --toggle-icon:  #5a5a7a;
      --divider:      rgba(0,0,0,0.07);
    }

    [data-theme="dark"] {
      --bg:           #0d0d1a;
      --bg-orb1:      rgba(99,102,241,0.28);
      --bg-orb2:      rgba(6,182,212,0.22);
      --bg-orb3:      rgba(139,92,246,0.15);
      --brand-bg:     linear-gradient(145deg, rgba(99,102,241,0.20) 0%, rgba(6,182,212,0.10) 100%);
      --brand-border: rgba(255,255,255,0.08);
      --form-bg:      rgba(10,10,22,0.88);
      --form-border:  rgba(255,255,255,0.06);
      --card-shadow:  0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.07);
      --text:         #e8e8f0;
      --text-sub:     #8a8aaa;
      --text-muted:   #5a5a78;
      --input-bg:     rgba(255,255,255,0.05);
      --input-border: rgba(255,255,255,0.09);
      --input-color:  #e0e0f0;
      --placeholder:  #3e3e5a;
      --icon-color:   #4a4a68;
      --link:         #818cf8;
      --link-hover:   #a5b4fc;
      --error-bg:     rgba(244,63,94,0.10);
      --error-border: rgba(244,63,94,0.20);
      --error-text:   #f87171;
      --success-bg:   rgba(16,185,129,0.10);
      --success-border:rgba(16,185,129,0.22);
      --success-text: #34d399;
      --qbox-bg:      rgba(99,102,241,0.08);
      --qbox-border:  rgba(99,102,241,0.18);
      --qbox-label:   #818cf8;
      --toggle-bg:    rgba(255,255,255,0.08);
      --toggle-hover: rgba(255,255,255,0.14);
      --toggle-icon:  #8a8aaa;
      --divider:      rgba(255,255,255,0.07);
    }

    html, body { min-height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); -webkit-font-smoothing: antialiased; transition: background .3s; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; overflow: hidden; }

    .bg { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse 70% 55% at 15% 50%, var(--bg-orb1) 0%, transparent 60%), radial-gradient(ellipse 55% 45% at 85% 60%, var(--bg-orb2) 0%, transparent 55%), radial-gradient(ellipse 45% 35% at 50% 5%, var(--bg-orb3) 0%, transparent 50%), var(--bg); transition: background .3s; }

    .theme-btn {
      position: fixed; top: 20px; right: 20px; z-index: 100;
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--toggle-bg); border: 1px solid var(--brand-border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--toggle-icon);
      transition: background .2s; backdrop-filter: blur(8px);
    }
    .theme-btn:hover { background: var(--toggle-hover); }
    .theme-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icon-sun, .icon-moon { position: absolute; transition: opacity .2s, transform .2s; }
    [data-theme="light"] .icon-moon { opacity: 0; transform: scale(.6); }
    [data-theme="light"] .icon-sun  { opacity: 1; transform: scale(1); }
    [data-theme="dark"]  .icon-sun  { opacity: 0; transform: scale(.6); }
    [data-theme="dark"]  .icon-moon { opacity: 1; transform: scale(1); }

    .card {
      position: relative; z-index: 1;
      display: flex; width: 100%; max-width: 860px; min-height: 480px;
      border-radius: 24px; overflow: hidden;
      box-shadow: var(--card-shadow); transition: box-shadow .3s;
    }

    /* Brand */
    .brand { flex: 1; padding: 48px 44px; background: var(--brand-bg); border-right: 1px solid var(--brand-border); display: flex; flex-direction: column; justify-content: center; transition: background .3s, border-color .3s; }
    .brand-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 44px; }
    .brand-logo-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--grad); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(99,102,241,0.35); flex-shrink: 0; }
    .brand-logo-icon svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .brand-logo-name { font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
    .brand-title { font-size: 30px; font-weight: 700; color: var(--text); line-height: 1.25; letter-spacing: -0.03em; margin-bottom: 12px; }
    .brand-title em { font-style: normal; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-desc { font-size: 14px; color: var(--text-sub); line-height: 1.7; margin-bottom: 40px; }
    .brand-steps { display: flex; flex-direction: column; gap: 16px; }
    .brand-step { display: flex; align-items: center; gap: 14px; }
    .step-num { width: 26px; height: 26px; border-radius: 50%; background: var(--grad); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0; box-shadow: 0 0 10px rgba(99,102,241,0.3); }
    .step-text { font-size: 13px; color: var(--text-sub); }
    .step-active .step-num { box-shadow: 0 0 0 3px rgba(99,102,241,0.25), 0 0 10px rgba(99,102,241,0.4); }
    .step-active .step-text { color: var(--text); font-weight: 500; }
    .step-done .step-num { background: linear-gradient(135deg, #10b981, #059669); }

    /* Form */
    .form-side { width: 380px; flex-shrink: 0; padding: 48px 38px; background: var(--form-bg); border-left: 1px solid var(--form-border); backdrop-filter: blur(20px); display: flex; flex-direction: column; justify-content: center; transition: background .3s; }
    .form-title { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; margin-bottom: 4px; }
    .form-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; }

    /* Alert */
    .alert { display: none; align-items: center; gap: 8px; padding: 10px 13px; border-radius: 9px; font-size: 13px; margin-bottom: 14px; }
    .alert.show { display: flex; }
    .alert-error { background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text); }
    .alert-success { background: var(--success-bg); border: 1px solid var(--success-border); color: var(--success-text); }

    /* Steps */
    .step { display: none; }
    .step.active { display: block; }

    /* Field */
    .field { margin-bottom: 14px; }
    .field-label { font-size: 12px; font-weight: 500; color: var(--text-sub); margin-bottom: 6px; display: block; }
    .field-wrap { position: relative; }
    .fi { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--icon-color); pointer-events: none; }
    .fi svg { width: 15px; height: 15px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .field-input { width: 100%; height: 44px; padding: 0 16px 0 40px; font-size: 14px; font-family: inherit; color: var(--input-color); background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 10px; outline: none; transition: border-color .2s, background .2s, box-shadow .2s, color .2s; }
    .field-input::placeholder { color: var(--placeholder); }
    .field-input:hover { border-color: rgba(99,102,241,0.3); }
    .field-input:focus { border-color: var(--input-focus); background: rgba(99,102,241,0.05); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    .field-input.no-icon { padding-left: 16px; }
    .pwd-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; color: var(--icon-color); background: none; border: none; cursor: pointer; border-radius: 6px; transition: color .15s; }
    .pwd-btn:hover { color: var(--text-sub); }
    .pwd-btn svg { width: 14px; height: 14px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Question box */
    .qbox { background: var(--qbox-bg); border: 1px solid var(--qbox-border); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
    .qbox-label { font-size: 12px; font-weight: 600; color: var(--qbox-label); margin-bottom: 8px; }
    .qbox .field-input { background: var(--input-bg); }

    .field-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .divider { height: 1px; background: var(--divider); margin: 4px 0 12px; }

    /* Buttons */
    .btn { width: 100%; height: 44px; border: none; border-radius: 10px; background: var(--grad); color: #fff; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; box-shadow: 0 4px 16px rgba(99,102,241,0.35); transition: opacity .2s, transform .15s, box-shadow .2s; }
    .btn:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); box-shadow: 0 6px 22px rgba(99,102,241,0.45); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-ghost { background: none; color: var(--text-muted); box-shadow: none; border: 1px solid var(--divider); margin-top: 10px; }
    .btn-ghost:hover:not(:disabled) { background: rgba(99,102,241,0.06); box-shadow: none; color: var(--text-sub); }

    /* Success */
    .success-icon { width: 60px; height: 60px; border-radius: 50%; background: var(--grad); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; box-shadow: 0 0 28px rgba(99,102,241,0.3); }
    .success-icon svg { width: 28px; height: 28px; fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .success-title { font-size: 20px; font-weight: 700; color: var(--text); text-align: center; margin-bottom: 6px; }
    .success-desc { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 24px; }

    /* Links */
    .links { margin-top: 16px; text-align: center; font-size: 13px; color: var(--text-muted); }
    .links a { color: var(--link); text-decoration: none; font-weight: 500; transition: color .15s; }
    .links a:hover { color: var(--link-hover); }

    @media (max-width: 700px) {
      .brand { display: none; }
      .card { max-width: 420px; }
      .form-side { width: 100%; padding: 40px 28px; }
    }
  </style>
</head>
<body>
<div class="bg"></div>

<button class="theme-btn" id="themeBtn" aria-label="切换主题">
  <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="card">
  <div class="brand">
    <div class="brand-logo">
      <div class="brand-logo-icon"><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></div>
      <span class="brand-logo-name">网址收藏夹</span>
    </div>
    <h1 class="brand-title">安全找回<br><em>账户密码</em></h1>
    <p class="brand-desc">通过预设的安全问题验证身份，无需邮件验证即可重置密码。</p>
    <div class="brand-steps" id="brand-steps">
      <div class="brand-step" id="brand-step1"><div class="step-num">1</div><span class="step-text">输入账户用户名</span></div>
      <div class="brand-step" id="brand-step2"><div class="step-num">2</div><span class="step-text">回答安全问题并设置新密码</span></div>
      <div class="brand-step" id="brand-step3"><div class="step-num">3</div><span class="step-text">重置成功，使用新密码登录</span></div>
    </div>
  </div>

  <div class="form-side">
    <div class="alert alert-error" id="alert-error"><span>⚠</span><span id="alert-error-text"></span></div>
    <div class="alert alert-success" id="alert-success"><span>✓</span><span id="alert-success-text"></span></div>

    <!-- Step 1: 输入用户名 -->
    <div class="step active" id="step1">
      <div class="form-title">忘记密码</div>
      <div class="form-sub">输入你的用户名继续</div>
      <div class="field">
        <label class="field-label" for="username">用户名</label>
        <div class="field-wrap">
          <span class="fi"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>
          <input class="field-input" type="text" id="username" placeholder="请输入用户名" autocomplete="username">
        </div>
      </div>
      <button class="btn" id="get-questions-btn">下一步</button>
    </div>

    <!-- Step 2: 安全问题 + 新密码 -->
    <div class="step" id="step2">
      <div class="form-title">验证身份</div>
      <div class="form-sub">回答以下安全问题</div>
      <div class="qbox">
        <div class="qbox-label" id="question1-label">安全问题 1</div>
        <input class="field-input" type="text" id="answer1" placeholder="请输入答案">
      </div>
      <div class="qbox">
        <div class="qbox-label" id="question2-label">安全问题 2</div>
        <input class="field-input" type="text" id="answer2" placeholder="请输入答案">
      </div>
      <div class="qbox">
        <div class="qbox-label" id="question3-label">安全问题 3</div>
        <input class="field-input" type="text" id="answer3" placeholder="请输入答案">
      </div>
      <div class="divider"></div>
      <div class="field">
        <label class="field-label" for="new-password">新密码</label>
        <div class="field-wrap">
          <span class="fi"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <input class="field-input" type="password" id="new-password" placeholder="至少 6 位">
          <button type="button" class="pwd-btn" id="pwdBtn" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div class="field-hint">密码至少 6 位</div>
      </div>
      <button class="btn" id="reset-password-btn">重置密码</button>
      <button class="btn btn-ghost" id="back-btn">返回上一步</button>
    </div>

    <!-- Step 3: 成功 -->
    <div class="step" id="step3">
      <div class="success-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="success-title">密码重置成功</div>
      <div class="success-desc">你现在可以使用新密码登录账户</div>
      <button class="btn" id="login-btn">去登录</button>
    </div>

    <div class="links"><a href="login.html">← 返回登录</a></div>
  </div>
</div>

<script>
(function () {
  const THEME_KEY = 'auth_theme';
  const html = document.documentElement;
  function getSystemTheme() { return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
  function applyTheme(t) { html.setAttribute('data-theme', t || getSystemTheme()); }
  applyTheme(localStorage.getItem(THEME_KEY));
  document.getElementById('themeBtn').addEventListener('click', function () {
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem(THEME_KEY, next);
  });
})();

document.addEventListener('DOMContentLoaded', function () {
  let questionsData = null;
  const steps = [document.getElementById('step1'), document.getElementById('step2'), document.getElementById('step3')];
  const brandSteps = [document.getElementById('brand-step1'), document.getElementById('brand-step2'), document.getElementById('brand-step3')];

  function goStep(n) {
    steps.forEach((s, i) => s.classList.toggle('active', i === n));
    brandSteps.forEach((s, i) => {
      s.classList.remove('step-active', 'step-done');
      if (i < n) s.classList.add('step-done');
      else if (i === n) s.classList.add('step-active');
    });
    hideAlerts();
  }

  function showError(msg) {
    document.getElementById('alert-error-text').textContent = msg;
    document.getElementById('alert-error').classList.add('show');
    document.getElementById('alert-success').classList.remove('show');
    setTimeout(() => document.getElementById('alert-error').classList.remove('show'), 5000);
  }
  function hideAlerts() {
    document.getElementById('alert-error').classList.remove('show');
    document.getElementById('alert-success').classList.remove('show');
  }

  goStep(0);

  document.getElementById('pwdBtn').addEventListener('click', function () {
    const el = document.getElementById('new-password');
    el.type = el.type === 'text' ? 'password' : 'text';
  });

  document.getElementById('get-questions-btn').addEventListener('click', async function () {
    const username = document.getElementById('username').value.trim();
    if (!username) { showError('请输入用户名'); return; }
    this.disabled = true; this.textContent = '加载中…';
    try {
      const r = await fetch('/api/auth/security-questions/reset?username=' + encodeURIComponent(username));
      const data = await r.json();
      if (r.ok) {
        questionsData = data;
        document.getElementById('question1-label').textContent = data.questions.question1;
        document.getElementById('question2-label').textContent = data.questions.question2;
        document.getElementById('question3-label').textContent = data.questions.question3;
        goStep(1);
      } else { showError(data.error || '获取安全问题失败'); }
    } catch (e) { showError('网络错误，请稍后重试'); }
    finally { this.disabled = false; this.textContent = '下一步'; }
  });

  document.getElementById('reset-password-btn').addEventListener('click', async function () {
    const a1 = document.getElementById('answer1').value.trim();
    const a2 = document.getElementById('answer2').value.trim();
    const a3 = document.getElementById('answer3').value.trim();
    const pwd = document.getElementById('new-password').value;
    if (!a1 || !a2 || !a3) { showError('请回答所有安全问题'); return; }
    if (!pwd) { showError('请输入新密码'); return; }
    if (pwd.length < 6) { showError('新密码长度不能少于 6 位'); return; }
    this.disabled = true; this.textContent = '重置中…';
    try {
      const r = await fetch('/api/auth/verify-and-reset', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: questionsData.username, answer1: a1, answer2: a2, answer3: a3, new_password: MD5(pwd) })
      });
      const data = await r.json();
      if (r.ok) { goStep(2); }
      else { showError(data.error || '重置密码失败'); }
    } catch (e) { showError('网络错误，请稍后重试'); }
    finally { this.disabled = false; this.textContent = '重置密码'; }
  });

  document.getElementById('back-btn').addEventListener('click', function () {
    document.getElementById('answer1').value = '';
    document.getElementById('answer2').value = '';
    document.getElementById('answer3').value = '';
    document.getElementById('new-password').value = '';
    goStep(0);
  });

  document.getElementById('login-btn').addEventListener('click', function () {
    window.location.href = 'login.html';
  });
});
</script>
</body>
</html>
