<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>书签首页</title>
  <link rel="icon" href="/favicon.ico" />
  <script src="/vue.global.prod.js"></script>
  <script src="/tailwind.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['-apple-system','BlinkMacSystemFont','"Segoe UI"','"PingFang SC"','"Hiragino Sans GB"','"Microsoft YaHei"','sans-serif'] },
          animation: { 'spin-slow': 'spin .8s linear infinite' },
        },
      },
    }
  </script>
  <style>
    [v-cloak]{display:none!important}
    html,body{overflow-y:auto!important;scroll-behavior:smooth}
    body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.08);border-radius:4px}
    .dark ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse-dot{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    .list-enter{opacity:0;transform:translateY(12px)}
    .list-enter-active{transition:all .35s ease-out}
    .card-stagger:nth-child(1){animation-delay:.02s}
    .card-stagger:nth-child(2){animation-delay:.05s}
    .card-stagger:nth-child(3){animation-delay:.08s}
    .card-stagger:nth-child(4){animation-delay:.11s}
    .card-stagger:nth-child(5){animation-delay:.14s}
    .card-stagger:nth-child(6){animation-delay:.17s}
    .card-stagger:nth-child(7){animation-delay:.2s}
    .card-stagger:nth-child(8){animation-delay:.23s}
    .card-stagger:nth-child(9){animation-delay:.26s}
    .card-stagger:nth-child(10){animation-delay:.29s}
    .card-stagger:nth-child(n+11){animation-delay:.32s}
    .dark body{background:#08080d}
    .pv-card-grid>*,.bookmark-grid>*{animation:fadeUp .4s cubic-bezier(.16,1,.3,1) forwards;opacity:0}
    .toc-item{animation:slideDown .25s ease forwards;opacity:0}
    .skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
    .dark .skeleton{background:linear-gradient(90deg,#1c1c22 25%,#26262e 50%,#1c1c22 75%);background-size:200% 100%}
  </style>
</head>
<body class="bg-[#f5f5fa] dark:bg-[#08080d] text-slate-800 dark:text-gray-200 min-h-screen">
<div id="app" v-cloak>

  <!-- ===== Header ===== -->
  <header class="sticky top-0 z-50 flex items-center justify-between px-4 sm:px-6 lg:px-8 h-14 lg:h-16 bg-white/80 dark:bg-[#0c0c12]/80 backdrop-blur-2xl border-b border-black/5 dark:border-white/5">
    <div class="flex items-center gap-2.5 lg:gap-3">
      <div class="w-8 h-8 lg:w-9 lg:h-9 rounded-xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-400 flex items-center justify-center text-base lg:text-lg text-white shadow-lg shadow-indigo-500/25 ring-1 ring-white/20">
        📎
      </div>
      <span class="text-base lg:text-lg font-extrabold text-slate-800 dark:text-white tracking-tight">书签首页</span>
    </div>
    <div class="flex items-center gap-1 lg:gap-1.5">
      <span v-if="currentUser"
        class="hidden sm:inline-flex items-center gap-1.5 text-xs lg:text-sm font-semibold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-500/10 px-2.5 lg:px-3 py-1.5 rounded-lg border border-indigo-500/10 dark:border-indigo-400/10">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-[pulse-dot_2s_ease-in-out_infinite]"></span>
        {{ currentUser.nickname || currentUser.username }}
      </span>
      <button @click="setTemplate('sidebar')"
        class="inline-flex items-center gap-1.5 px-2.5 lg:px-3.5 py-2 rounded-lg text-sm font-medium transition-all duration-200"
        :class="template==='sidebar' ? 'text-white bg-gradient-to-r from-indigo-500 to-purple-500 shadow-md shadow-indigo-500/25' : 'text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-500/10'">
        📂 <span class="hidden sm:inline">侧边栏</span>
      </button>
      <button @click="setTemplate('portal')"
        class="inline-flex items-center gap-1.5 px-2.5 lg:px-3.5 py-2 rounded-lg text-sm font-medium transition-all duration-200"
        :class="template==='portal' ? 'text-white bg-gradient-to-r from-indigo-500 to-purple-500 shadow-md shadow-indigo-500/25' : 'text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-500/10'">
        🏠 <span class="hidden sm:inline">门户</span>
      </button>
      <button @click="toggleTheme"
        class="inline-flex items-center justify-center w-9 h-9 rounded-lg text-sm text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-500/10 transition-all duration-200">
        {{ theme === 'dark' ? '☀️' : '🌙' }}
      </button>
      <a href="/admin.html"
        class="inline-flex items-center gap-1.5 px-2.5 lg:px-3.5 py-2 rounded-lg text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-500/10 transition-all duration-200">
        ← <span class="hidden sm:inline">管理</span>
      </a>
    </div>
  </header>

  <!-- ========== SIDEBAR TEMPLATE ========== -->
  <template v-if="template === 'sidebar'">
    <div class="flex h-[calc(100vh-3.5rem)] lg:h-[calc(100vh-4rem)]">

      <!-- Sidebar -->
      <aside class="w-56 lg:w-64 min-w-[14rem] lg:min-w-[16rem] overflow-y-auto bg-white dark:bg-[#0f0f15] border-r border-black/5 dark:border-white/5 py-4">
        <div v-for="node in tree" :key="node.id" class="px-3">
          <tree-node :node="node" :depth="0" :selected-id="selectedId" @select="selectFolder" />
        </div>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 bg-[#f5f5fa] dark:bg-[#08080d]">

        <!-- Header area -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 lg:mb-8">
          <div>
            <h2 class="text-2xl lg:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 dark:from-indigo-400 dark:via-purple-400 dark:to-pink-400 bg-clip-text text-transparent">
              {{ currentFolderTitle }}
            </h2>
            <div v-if="currentFolderPath" class="text-xs text-slate-400 dark:text-slate-500 mt-1.5 font-medium flex items-center gap-1">
              <span>📁</span> {{ currentFolderPath }}
            </div>
          </div>
          <div class="relative w-full sm:w-72 lg:w-80 group">
            <div class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none">
              <span class="text-sm text-slate-400">🔍</span>
            </div>
            <input type="text" v-model="searchQuery" placeholder="搜索书签..." @input="handleSearch"
              class="w-full pl-9 pr-8 py-2.5 bg-white dark:bg-[#14141c] border border-slate-200 dark:border-slate-700/60 rounded-xl text-sm text-slate-800 dark:text-gray-200 font-medium placeholder:text-slate-400 dark:placeholder:text-slate-500 outline-none transition-all duration-200 focus:border-indigo-400 dark:focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 dark:focus:ring-indigo-400/10 shadow-sm" />
            <button v-if="searchQuery" @click="clearSearch"
              class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-indigo-500 text-sm transition-colors">✕</button>
          </div>
        </div>

        <!-- Search result count -->
        <div v-if="searchQuery && filteredBookmarks.length > 0"
          class="text-sm text-slate-500 dark:text-slate-400 font-medium mb-4 flex items-center gap-2">
          <span class="w-1 h-4 rounded-full bg-indigo-400"></span>
          搜索到 {{ filteredBookmarks.length }} 个书签
        </div>

        <!-- Empty state -->
        <div v-if="bookmarks.length === 0 && !loading"
          class="flex flex-col items-center justify-center py-24 text-slate-400 dark:text-slate-500">
          <div class="text-6xl mb-6 opacity-25">📂</div>
          <p class="text-lg font-medium">暂无书签</p>
          <p class="text-sm mt-1 opacity-60">去管理页面添加一些书签吧</p>
        </div>

        <!-- Loading skeleton -->
        <div v-if="loading" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3 lg:gap-4">
          <div v-for="i in 6" :key="i" class="flex items-center gap-3.5 p-4 lg:p-5 rounded-2xl bg-white dark:bg-[#14141c] border border-black/5 dark:border-white/5">
            <div class="w-6 h-6 rounded-lg skeleton flex-shrink-0"></div>
            <div class="flex-1 space-y-2">
              <div class="h-4 w-3/4 rounded-lg skeleton"></div>
              <div class="h-3 w-full rounded-lg skeleton"></div>
            </div>
          </div>
        </div>

        <!-- Bookmark cards -->
        <div v-if="bookmarks.length > 0" class="bookmark-grid grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3 lg:gap-4">
          <a v-for="item in bookmarks" :key="item.id"
            :href="item.url" target="_blank" rel="noopener"
            class="card-stagger group relative flex items-center gap-3.5 p-4 lg:p-5 bg-white dark:bg-[#14141c] border border-slate-100 dark:border-white/5 rounded-2xl shadow-sm hover:shadow-xl hover:shadow-indigo-500/8 dark:hover:shadow-indigo-500/5 hover:border-indigo-200/50 dark:hover:border-indigo-500/20 hover:-translate-y-0.5 transition-all duration-300 cursor-pointer overflow-hidden">
            <!-- Left gradient accent -->
            <div class="absolute left-0 top-2 bottom-2 w-0.5 rounded-full bg-gradient-to-b from-indigo-400 via-purple-400 to-pink-400 opacity-0 group-hover:opacity-100 transition-all duration-300 group-hover:top-1 group-hover:bottom-1"></div>
            <!-- Shine effect -->
            <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none bg-[radial-gradient(600px_circle_at_var(--mouse-x,_50%)_var(--mouse-y,_50%),rgba(99,102,241,.06),transparent_60%)]"></div>
            <!-- Favicon -->
            <div class="relative flex-shrink-0">
              <div class="w-9 h-9 lg:w-10 lg:h-10 rounded-xl bg-gradient-to-br from-slate-50 to-slate-100 dark:from-slate-800 dark:to-slate-700 border border-slate-200 dark:border-slate-600/50 flex items-center justify-center overflow-hidden shadow-sm group-hover:shadow-md group-hover:shadow-indigo-500/10 transition-all duration-300 group-hover:scale-105">
                <img v-if="faviconUrl(item)" :src="faviconUrl(item)" class="w-5 h-5 lg:w-[22px] lg:h-[22px] object-contain" alt="" @error="onFaviconError" />
                <span v-else class="text-lg">🌐</span>
              </div>
            </div>
            <!-- Info -->
            <div class="flex-1 min-w-0">
              <div class="text-sm lg:text-[0.9rem] font-semibold text-slate-800 dark:text-gray-100 truncate group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors duration-300">{{ item.title }}</div>
              <div class="flex items-center gap-2 mt-1">
                <span class="text-[11px] text-slate-400 dark:text-slate-500 truncate">{{ getDomain(item.url) }}</span>
              </div>
            </div>
            <!-- Arrow -->
            <div class="flex-shrink-0 w-7 h-7 rounded-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 group-hover:bg-indigo-50 dark:group-hover:bg-indigo-500/15 group-hover:border-indigo-200 dark:group-hover:border-indigo-500/30 transition-all duration-300">
              <span class="text-xs text-slate-400 group-hover:text-indigo-500 dark:group-hover:text-indigo-400 transition-colors">↗</span>
            </div>
          </a>
        </div>
      </main>
    </div>
  </template>

  <!-- ========== PORTAL TEMPLATE ========== -->
  <template v-if="template === 'portal'">

    <!-- Hero -->
    <div class="relative bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 text-white px-5 py-14 lg:py-20 text-center overflow-hidden">
      <!-- Decorative orbs -->
      <div class="absolute -top-20 -left-20 w-64 h-64 rounded-full bg-white/5 blur-3xl"></div>
      <div class="absolute -bottom-20 -right-20 w-80 h-80 rounded-full bg-pink-300/10 blur-3xl"></div>
      <div class="absolute inset-0 opacity-[0.03]" style="background-image:url(&quot;data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23fff' fill-opacity='1' fill-rule='evenodd'%3E%3Cpath d='M0 40L40 0H20L0 20M40 40V20L20 40'/%3E%3C/g%3E%3C/svg%3E&quot;);background-size:40px 40px"></div>
      <div class="relative max-w-2xl mx-auto">
        <div class="inline-flex items-center gap-2 bg-white/15 backdrop-blur-sm rounded-full px-4 py-1.5 mb-5 text-sm font-medium border border-white/20">
          <span>📎</span> 书签导航
        </div>
        <h1 class="text-4xl sm:text-5xl lg:text-6xl font-black mb-3 tracking-tight drop-shadow-lg leading-tight">
          探索你的<span class="bg-clip-text text-transparent bg-gradient-to-r from-yellow-200 to-pink-200">书签世界</span>
        </h1>
        <p class="text-sm sm:text-base text-white/80 mb-8 max-w-md mx-auto font-medium">精选网址资源，一键直达</p>
        <div class="max-w-xl mx-auto flex bg-white/15 backdrop-blur-xl rounded-2xl overflow-hidden border border-white/25 shadow-2xl shadow-black/20 ring-1 ring-white/10">
          <input type="text" v-model="searchQuery" @input="debouncedSearch" placeholder="搜索书签标题或网址..."
            class="flex-1 px-5 py-3.5 sm:px-6 sm:py-4 bg-transparent border-none outline-none text-white text-sm sm:text-base font-medium placeholder:text-white/50" />
          <button @click="doSearch" class="px-6 sm:px-8 bg-white/25 text-white font-semibold text-sm sm:text-base hover:bg-white/35 transition-all duration-200 border-l border-white/15">🔍 搜索</button>
        </div>
      </div>
    </div>

    <!-- Search banner -->
    <div v-if="isSearching"
      class="flex items-center justify-center gap-2 bg-gradient-to-r from-indigo-50 to-purple-50 dark:from-indigo-500/8 dark:to-purple-500/8 text-indigo-600 dark:text-indigo-400 px-5 py-3.5 text-sm sm:text-base font-medium border-b border-indigo-500/10 dark:border-indigo-400/10">
      <span>🔍</span>
      搜索 "{{ searchQuery }}" 找到 {{ searchResults.length }} 个结果
      <a @click="clearSearch" class="ml-2 underline decoration-2 decoration-indigo-400/30 hover:decoration-indigo-600 cursor-pointer font-bold">清除搜索</a>
    </div>

    <!-- Loading -->
    <div v-if="loading" class="flex flex-col items-center justify-center py-32">
      <div class="w-10 h-10 border-[3px] border-indigo-200 dark:border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin-slow mb-5"></div>
      <p class="text-sm text-slate-400 dark:text-slate-500 font-medium">正在加载书签...</p>
    </div>

    <!-- Content -->
    <div v-if="!loading" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 lg:py-10">

      <!-- Toolbar -->
      <div class="flex items-center gap-3 lg:gap-4 mb-6 lg:mb-8 px-4 lg:px-6 py-3.5 bg-white dark:bg-[#14141c] border border-slate-100 dark:border-white/5 rounded-xl shadow-sm">
        <label class="text-sm font-semibold text-slate-700 dark:text-gray-200 whitespace-nowrap">卡片大小</label>
        <input type="range" min="0.6" max="1.6" step="0.1" v-model.number="itemSize" @input="onSizeChange"
          class="w-28 lg:w-36 accent-indigo-500 cursor-pointer" />
        <span class="min-w-[2.5rem] text-center text-sm font-bold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-500/10 px-2.5 py-1 rounded-md">{{ itemSize.toFixed(1) }}x</span>
      </div>

      <!-- Empty -->
      <div v-if="displaySections.length === 0" class="flex flex-col items-center justify-center py-24 text-slate-400 dark:text-slate-500">
        <div class="text-6xl mb-6 opacity-25">📚</div>
        <p v-if="isSearching" class="text-lg font-medium">没有找到匹配的书签</p>
        <p v-else class="text-lg font-medium">暂无书签</p>
      </div>



      <!-- Sections -->
      <div v-for="section in displaySections" :key="section.id" :id="'section-'+section.id" class="mb-8 lg:mb-10">
        <div class="bg-white dark:bg-[#14141c] border border-slate-100 dark:border-white/5 rounded-2xl lg:rounded-3xl p-5 lg:p-8 shadow-sm hover:shadow-md transition-all duration-300">
          <!-- Section header -->
          <div class="flex items-center gap-3 pb-4 lg:pb-5 mb-5 lg:mb-6 border-b border-slate-100 dark:border-white/5">
            <div class="w-9 h-9 lg:w-11 lg:h-11 rounded-xl bg-gradient-to-br from-indigo-50 to-purple-50 dark:from-indigo-500/15 dark:to-purple-500/8 flex items-center justify-center text-lg lg:text-xl shadow-sm border border-indigo-100 dark:border-indigo-400/10 overflow-hidden">
              <img v-if="isIconUrl(section.icon)" :src="section.icon" class="w-5 h-5 lg:w-6 lg:h-6 object-contain" alt="" @error="onIconError($event)" />
              <span v-else>{{ section.icon || '📁' }}</span>
            </div>
            <div>
              <h2 class="text-base lg:text-lg font-bold text-slate-800 dark:text-gray-100 tracking-tight">{{ section.title }}</h2>
            </div>
            <span class="ml-auto inline-flex items-center gap-1 text-xs font-semibold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-500/15 px-3 py-1.5 rounded-full border border-indigo-100 dark:border-indigo-400/10">
              <span>{{ section.bookmarks.length }}</span> 个
            </span>
          </div>
          <!-- Card grid -->
          <div class="pv-card-grid grid gap-3 lg:gap-4" :style="{'grid-template-columns': 'repeat(auto-fill, minmax(' + (110 * itemSize) + 'px, 1fr))'}">
            <a v-for="(bm, idx) in section.bookmarks" :key="bm.id"
              :href="bm.url" target="_blank" rel="noopener noreferrer"
              :title="bm.title + (bm.remark ? ' - ' + bm.remark : '')"
              class="group relative flex flex-col items-center bg-white dark:bg-[#1a1a22] border border-slate-100 dark:border-white/5 rounded-2xl shadow-sm hover:shadow-xl hover:shadow-indigo-500/8 dark:hover:shadow-indigo-500/5 hover:border-indigo-200/50 dark:hover:border-indigo-500/20 hover:-translate-y-1 transition-all duration-300 overflow-hidden"
              :style="{'padding': (itemSize*16)+'px '+(itemSize*10)+'px '+(itemSize*14)+'px', 'gap': (itemSize*10)+'px', 'border-radius': (itemSize*16)+'px', animationDelay: (idx*0.03)+'s'}">
              <!-- Top gradient bar -->
              <div class="absolute top-0 left-2 right-2 h-0.5 rounded-full bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 opacity-0 group-hover:opacity-100 transition-all duration-300 scale-x-0 group-hover:scale-x-100 origin-left"></div>
              <!-- Shine -->
              <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none bg-[radial-gradient(400px_circle_at_50%_-20%,rgba(99,102,241,.08),transparent_60%)]"></div>
              <!-- Icon -->
              <div class="relative flex items-center justify-center rounded-2xl border border-slate-100 dark:border-slate-700/50 bg-gradient-to-br from-slate-50 to-slate-100 dark:from-[#1e1e26] dark:to-[#26262e] shadow-sm overflow-hidden group-hover:shadow-md group-hover:shadow-indigo-500/10 group-hover:scale-105 transition-all duration-300"
                :style="{'width': (itemSize*56)+'px', 'height': (itemSize*56)+'px', 'border-radius': (itemSize*14)+'px'}">
                <img v-if="faviconUrl(bm)" :src="faviconUrl(bm)" alt="" @error="onImgError($event)"
                  :style="{'width': (itemSize*36)+'px', 'height': (itemSize*36)+'px'}" class="object-contain" />
                <span v-else :style="{'font-size': (itemSize*32)+'px'}">🌏</span>
              </div>
              <!-- Title -->
              <div class="text-center font-semibold text-slate-600 dark:text-slate-400 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors duration-300 max-w-full truncate px-0.5"
                :style="{'font-size': (itemSize*13)+'px'}">{{ getSiteName(bm) }}</div>
            </a>
          </div>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
const { createApp, nextTick } = Vue;

const TreeNode = {
  name: 'TreeNode',
  props: { node: Object, depth: Number, selectedId: Number },
  emits: ['select'],
  data(){return{expanded:false}},
  computed:{
    isFolder(){return this.node.type==='folder'},
    isSelected(){return this.selectedId===this.node.id},
    hasChildren(){return this.isFolder&&this.node.children?.length},
    indentStyle(){return{paddingLeft:(this.depth*14+14)+'px'}},
  },
  methods:{
    onClick(){
      if(this.isFolder){this.expanded=!this.expanded;this.$emit('select',this.node.id)}
      else{this.$emit('select',this.node.id)}
    },
    onSelect(id){this.$emit('select',id)},
    isUrl(s){return s&&(s.startsWith('http')||s.startsWith('/')||s.startsWith('data:'))},
  },
  template:`
    <div>
      <div @click="onClick"
        class="flex items-center gap-2 px-3.5 py-2 rounded-xl cursor-pointer transition-all duration-200 text-sm mx-0.5 my-0.5"
        :style="indentStyle"
        :class="isSelected ? 'bg-gradient-to-r from-indigo-50 to-purple-50 dark:from-indigo-500/15 dark:to-purple-500/8 text-indigo-600 dark:text-indigo-400 font-semibold shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:bg-indigo-50/60 dark:hover:bg-indigo-500/8 hover:text-indigo-600 dark:hover:text-indigo-400'">
        <span class="text-[10px] w-3 text-center flex-shrink-0 text-slate-400 dark:text-slate-500 transition-transform duration-200" :class="{'rotate-90':expanded}" v-if="hasChildren">▶</span>
        <span class="w-3 flex-shrink-0" v-else></span>
        <span v-if="isFolder">
          <img v-if="node.favicon_url&&isUrl(node.favicon_url)" :src="node.favicon_url" class="w-4 h-4 object-contain flex-shrink-0 rounded" @error="onIconError" />
          <span v-else class="text-sm flex-shrink-0">{{node.favicon_url||'📁'}}</span>
        </span>
        <span v-else class="text-sm flex-shrink-0">🔗</span>
        <span class="flex-1 truncate">{{node.title}}</span>
        <span v-if="isFolder&&node.bookmark_count!=null"
          class="text-xs font-semibold rounded-full px-2.5 py-0.5 transition-colors"
          :class="isSelected?'bg-indigo-500/15 text-indigo-600 dark:text-indigo-300':'bg-slate-100 dark:bg-white/8 text-slate-400'">{{node.bookmark_count}}</span>
      </div>
      <div v-if="isFolder&&expanded&&hasChildren" class="overflow-hidden transition-all duration-200">
        <tree-node v-for="child in node.children" :key="child.id" :node="child" :depth="depth+1" :selected-id="selectedId" @select="onSelect" />
      </div>
    </div>
  `
};

const app = createApp({
  components:{TreeNode},
  data(){
    return{
      token:localStorage.getItem('token')||'',
      currentUser:null, tree:[], selectedId:null, loading:true,
      searchQuery:'', searchTimer:null, isSearching:false, searchResults:[],
      theme:localStorage.getItem('theme')||'light', template:'sidebar', itemSize:1,
    }
  },
  computed:{
    totalCount(){
      let c=0; const count=nodes=>{for(const n of nodes){if(n.type==='bookmark')c++;if(n.children)count(n.children)}};
      count(this.tree); return c;
    },
    bookmarks(){
      let items=[];
      const collect=(nodes,path=[])=>{
        for(const n of nodes){
          if(n.type==='folder'){
            if(this.selectedId===null||this.selectedId===n.id||this.isChildOf(n.id,this.selectedId))
              collect(n.children||[],[...path,n.title]);
          }else if(n.type==='bookmark'){
            if(this.selectedId===null||this.isInFolder(n.id))
              items.push({...n,path:path.join(' / ')});
          }
        }
      };
      if(this.selectedId===null) collect(this.tree);
      else if(this.selectedId){
        const f=this.findNode(this.selectedId,this.tree);
        if(f){if(f.type==='folder')collect(f.children||[],[f.title]);else items.push({...f})}
      }
      if(this.searchQuery){
        const q=this.searchQuery.toLowerCase();
        items=items.filter(i=>(i.title&&i.title.toLowerCase().includes(q))||(i.url&&i.url.toLowerCase().includes(q)));
      }
      return items;
    },
    filteredBookmarks(){
      if(!this.searchQuery)return[];
      const q=this.searchQuery.toLowerCase(); const all=[];
      const collect=nodes=>{for(const n of nodes){if(n.type==='bookmark'&&((n.title&&n.title.toLowerCase().includes(q))||(n.url&&n.url.toLowerCase().includes(q))))all.push(n);if(n.children)collect(n.children)}};
      collect(this.tree); return all;
    },
    currentFolderTitle(){
      if(this.searchQuery)return '搜索结果';
      if(this.selectedId===null)return '所有书签';
      const n=this.findNode(this.selectedId,this.tree); return n?n.title:'所有书签';
    },
    currentFolderPath(){
      if(this.searchQuery||this.selectedId===null)return '';
      const find=(nodes,targetId,path=[])=>{
        for(const n of nodes){
          if(n.id===targetId)return[...path,n.title];
          if(n.children){const r=find(n.children,targetId,[...path,n.title]);if(r)return r}
        }return null;
      };
      const p=find(this.tree,this.selectedId); return p?p.join(' / '):'';
    },
    displaySections(){
      if(this.isSearching){
        if(this.searchResults.length===0)return[];
        return[{id:'search',icon:'🔍',title:'搜索结果 ('+this.searchResults.length+')',bookmarks:this.searchResults}];
      }
      const r=[];
      const walk=(nodes,pp)=>{
        for(const n of nodes){
          if(n.type==='folder'){
            const p=pp?pp+' / '+n.title:n.title; const bm=[];
            const collect=ch=>{for(const c of ch){if(c.type==='bookmark')bm.push(c);else if(c.type==='folder'&&c.children)collect(c.children)}};
            collect(n.children||[]);
            if(bm.length>0)r.push({id:n.id,icon:n.favicon_url||'📁',title:p,bookmarks:bm});
            if(n.children)walk(n.children,p);
          }
        }
      };
      walk(this.tree,''); return r;
    },
  },
  methods:{
    getHeaders(ct){const h={};if(ct)h['Content-Type']=ct;if(this.token)h['Authorization']=this.token;return h},
    faviconUrl(item){
      if(item.favicon_url)return item.favicon_url;
      try{const u=new URL(item.url);return u.origin+'/favicon.ico'}catch{return''}
    },
    getDomain(url){try{const u=new URL(url);return u.hostname.replace(/^www\./,'')}catch{return url}},
    async checkAuth(){
      if(!this.token){window.location.href='/login.html';return}
      try{const r=await fetch('/api/auth/me',{headers:this.getHeaders()});if(!r.ok){localStorage.removeItem('token');window.location.href='/login.html';return};this.currentUser=await r.json()}catch{window.location.href='/login.html'}
    },
    async loadTree(){this.loading=true;try{const r=await fetch('/api/tree',{headers:this.getHeaders()});if(r.ok){this.tree=await r.json();if(this.selectedId===null&&this.tree.length>0)this.selectedId=this.tree[0].id}}catch{};this.loading=false},
    async loadConfig(){
      try{const r=await fetch('/api/config',{headers:this.getHeaders()});if(r.ok){const c=await r.json();if(c['view_template'])this.template=c['view_template'];if(c['portal_view_scale']){const v=parseFloat(c['portal_view_scale']);if(v>=0.6&&v<=1.6)this.itemSize=v}}}catch{}
    },
    async saveSetting(k,v){try{await fetch('/api/config',{method:'POST',headers:this.getHeaders('application/json'),body:JSON.stringify({key:k,value:v})})}catch{}},
    setTemplate(tpl){this.template=tpl;this.saveSetting('view_template',tpl)},
    getSiteName(item){let n=(item.title||'').trim();for(const s of[' - ',' – ',' | ',' — ',' | ']){if(n.includes(s)){n=n.split(s)[0].trim();break}}return n},
    onSizeChange(){this.saveSetting('portal_view_scale',this.itemSize.toString())},
    findNode(id,nodes){for(const n of nodes){if(n.id===id)return n;if(n.children){const f=this.findNode(id,n.children);if(f)return f}}return null},
    isChildOf(pid,cid){const p=this.findNode(pid,this.tree);if(!p||!p.children)return false;return!!this.findNode(cid,p.children)},
    isInFolder(bid){if(this.selectedId===null)return true;const walk=nodes=>{for(const n of nodes){if(n.id===bid)return true;if(n.children&&walk(n.children))return true}return false};const f=this.findNode(this.selectedId,this.tree);if(!f)return false;return walk(f.children||[])},
    selectFolder(id){this.selectedId=id;this.searchQuery=''},
    handleSearch(){},
    clearSearch(){this.searchQuery='';this.isSearching=false;this.searchResults=[]},
    doSearch(){const q=this.searchQuery.toLowerCase().trim();if(!q){this.clearSearch();return};const all=[];const collect=nodes=>{for(const n of nodes){if(n.type==='bookmark')all.push(n);if(n.children)collect(n.children)}};collect(this.tree);this.searchResults=all.filter(b=>b.title.toLowerCase().includes(q)||(b.url||'').toLowerCase().includes(q));this.isSearching=true},
    debouncedSearch(){if(this.searchTimer)clearTimeout(this.searchTimer);this.searchTimer=setTimeout(()=>this.doSearch(),300)},
    toggleTheme(){this.theme=this.theme==='dark'?'light':'dark';document.documentElement.className=this.theme;localStorage.setItem('theme',this.theme)},
    onImgError(e){e.target.style.display='none';e.target.parentElement.innerHTML='🌏'},
    onFaviconError(e){e.target.style.display='none';e.target.parentElement.innerHTML='🌐'},
    isIconUrl(s){return s&&(s.startsWith('http')||s.startsWith('/')||s.startsWith('data:'))},
    onIconError(e){e.target.style.display='none';e.target.parentElement.innerHTML='📁'},
    scrollToSection(id){const el=document.getElementById('section-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},
    handleMouseMove(e,target){
      const rect=target.getBoundingClientRect();
      target.style.setProperty('--mouse-x',((e.clientX-rect.left)/rect.width*100)+'%');
      target.style.setProperty('--mouse-y',((e.clientY-rect.top)/rect.height*100)+'%');
    },
  },
  mounted(){
    const saved=localStorage.getItem('theme')||'light';
    this.theme=saved; document.documentElement.className=saved;
    this.checkAuth().then(()=>{this.loadConfig();this.loadTree()});
    // Track mouse for shine effect on cards
    document.addEventListener('mousemove',e=>{
      document.querySelectorAll('[data-shine]').forEach(el=>{
        const rect=el.getBoundingClientRect();
        el.style.setProperty('--mouse-x',((e.clientX-rect.left)/rect.width*100)+'%');
        el.style.setProperty('--mouse-y',((e.clientY-rect.top)/rect.height*100)+'%');
      });
    });
  },
});
app.mount('#app');
</script>
</body>
</html>
