<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>跳转中…</title>
</head>
<body>
<script>
  // 兼容旧入口：新版首页已拆分为 view-sidebar.html（侧边）和 view-portal.html（门户），
  // 按 ?t= 参数或用户保存的布局偏好（view_template）跳转
  (async function () {
    const t = new URLSearchParams(window.location.search).get('t');
    if (t === 'portal' || t === 'sidebar') {
      window.location.replace('/view-' + t + '.html');
      return;
    }
    const token = localStorage.getItem('token');
    if (token) {
      try {
        const r = await fetch('/api/config', { headers: { 'Authorization': token } });
        if (r.ok) {
          const c = await r.json();
          if (c.view_template === 'portal') {
            window.location.replace('/view-portal.html');
            return;
          }
        }
      } catch (e) {}
    }
    window.location.replace('/view-sidebar.html');
  })();
</script>
</body>
</html>
