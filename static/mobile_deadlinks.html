<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>清理失效 - 网址收藏夹</title>
  <link rel="icon" href="/favicon.ico" />
  <script src="/vue.global.prod.js"></script>
  <style>
    /* ============ CSS Variables ============ */
    :root {
      --bg: #f3f3f3;
      --surface: #ffffff;
      --surface2: #f9f9f9;
      --surface3: #efefef;
      --border: #e0e0e0;
      --text: #1a1a1a;
      --text2: #444;
      --text3: #888;
      --primary: #0078d4;
      --primary-light: #e8f3fc;
      --primary-hover: #006cbd;
      --danger: #d13438;
      --danger-bg: #fde7e9;
      --shadow-sm: 0 1px 4px rgba(0,0,0,.08);
      --shadow-md: 0 4px 16px rgba(0,0,0,.12);
      --shadow-lg: 0 8px 32px rgba(0,0,0,.16);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --header-h: 56px;
    }
    [data-theme="dark"] {
      --bg: #1a1a1a;
      --surface: #242424;
      --surface2: #2c2c2c;
      --surface3: #363636;
      --border: #3a3a3a;
      --text: #f3f3f3;
      --text2: #ccc;
      --text3: #777;
      --primary: #2899f5;
      --primary-light: #1c2f40;
      --shadow-sm: 0 1px 4px rgba(0,0,0,.3);
      --shadow-md: 0 4px 16px rgba(0,0,0,.4);
      --shadow-lg: 0 8px 32px rgba(0,0,0,.5);
    }

    /* ============ Reset ============ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; border: none; background: none; font-family: inherit; color: inherit; }
    [v-cloak] { display: none !important; }

    /* ============ App Shell ============ */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* ============ Header ============ */
    .edge-header {
      flex-shrink: 0;
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
      z-index: 50;
    }
    .header-back {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      font-size: 18px;
      color: var(--text2);
      transition: background .15s;
    }
    .header-back:active { background: var(--surface3); }
    .header-title {
      flex: 1;
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-action {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      font-size: 18px;
      color: var(--text2);
      transition: background .15s;
    }
    .header-action:active { background: var(--surface3); }

    /* ============ Main Scroll Area ============ */
    .edge-main {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 12px 12px 100px;
    }

    /* ============ Description Banner ============ */
    .desc-banner {
      background: var(--surface);
      border-left: 4px solid #f59e0b;
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 13px;
      color: var(--text2);
      line-height: 1.6;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }

    /* ============ Progress Area ============ */
    .progress-area {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }
    .progress-text {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 8px;
    }
    .progress-bar-wrap {
      height: 8px;
      background: var(--surface3);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    /* ============ Empty State ============ */
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--text3);
    }
    .empty-icon { font-size: 52px; margin-bottom: 16px; }
    .empty-title { font-size: 16px; font-weight: 600; color: var(--text2); margin-bottom: 8px; }
    .empty-desc { font-size: 13px; line-height: 1.6; }

    /* ============ Section Title ============ */
    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 16px 0 8px;
    }
    .section-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 10px;
      color: #fff;
    }
    .dead-badge { background: var(--danger); }
    .susp-badge { background: #f59e0b; }
    .section-count { font-size: 13px; color: var(--text3); }

    /* ============ Dead Link Card ============ */
    .deadlink-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 10px;
      padding: 14px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: box-shadow .2s;
    }
    .deadlink-card:active { box-shadow: var(--shadow-md); }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .card-checkbox {
      margin-top: 3px;
      width: 18px; height: 18px;
      flex-shrink: 0;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .card-favicon {
      width: 20px; height: 20px;
      flex-shrink: 0;
      object-fit: contain;
      border-radius: 3px;
      margin-top: 2px;
    }
    .card-favicon-placeholder {
      font-size: 16px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .card-title {
      flex: 1;
      font-weight: 500;
      color: var(--text);
      word-break: break-word;
      line-height: 1.4;
      font-size: 14px;
    }
    .card-url {
      font-size: 12px;
      color: var(--primary);
      word-break: break-all;
      line-height: 1.3;
      text-decoration: none;
    }
    .card-path {
      font-size: 12px;
      color: var(--text3);
      word-break: break-all;
    }
    .card-reason {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 4px;
      align-self: flex-start;
    }
    .dead-reason {
      background: var(--danger-bg);
      color: var(--danger);
    }
    .susp-reason {
      background: rgba(245, 158, 11, 0.1);
      color: #d97706;
    }
    [data-theme="dark"] .susp-reason {
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
    }
    .card-delete-btn {
      padding: 8px;
      background: var(--danger-bg);
      color: var(--danger);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity .15s;
    }
    .card-delete-btn:active { opacity: .7; }

    /* ============ Bottom Bar ============ */
    .bottom-bar {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 200;
      box-shadow: 0 -2px 12px rgba(0,0,0,.08);
    }
    .bottom-bar-row {
      display: flex;
      gap: 8px;
    }
    .bar-btn {
      flex: 1;
      padding: 10px 6px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
      text-align: center;
    }
    .bar-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }
    .bar-btn:active:not(:disabled) { opacity: .8; }
    .bar-btn.primary {
      background: var(--primary);
      color: #fff;
    }
    .bar-btn.danger {
      background: var(--danger);
      color: #fff;
    }
    .bar-btn.secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .bar-btn.stop {
      background: var(--text3);
      color: #fff;
    }

    /* ============ Toast ============ */
    .toast {
      position: fixed;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      border-radius: 20px;
      color: #fff;
      font-size: 13px;
      z-index: 500;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: var(--shadow-md);
    }
    .toast.success { background: #107c10; }
    .toast.info { background: var(--primary); }
    .toast.warning { background: #ca5010; }
    .toast.error {
      background: var(--danger);
      pointer-events: all;
      border-radius: var(--radius-lg);
      padding: 14px 18px;
      max-width: 90vw;
      white-space: normal;
      text-align: center;
    }

    /* ============ View Toggle / Status Groups ============ */
    .view-seg {
      display: flex;
      background: var(--surface3);
      border-radius: var(--radius-sm);
      padding: 3px;
      gap: 3px;
      margin-bottom: 12px;
    }
    .view-seg button {
      flex: 1;
      padding: 7px 0;
      font-size: 13px;
      border-radius: 5px;
      color: var(--text2);
      transition: all .15s;
    }
    .view-seg button.active {
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    .group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 16px 0 8px;
    }
    .group-actions { display: flex; gap: 8px; margin-left: auto; }
    .group-btn {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
    }
    .group-btn.danger { background: var(--danger-bg); color: var(--danger); border-color: transparent; }

    /* ============ Transitions ============ */
    .fade-enter-active, .fade-leave-active { transition: opacity .2s; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }
  </style>
</head>
<body>
<div id="app" v-cloak>

  <!-- Header -->
  <div class="edge-header">
    <button class="header-back" @click="goBack">
      <span>&#8592;</span>
    </button>
    <span class="header-title">清理失效</span>
    <button class="header-action" @click="toggleTheme" title="切换主题">
      {{ isDark ? '☀️' : '🌙' }}
    </button>
  </div>

  <!-- Main Content -->
  <div class="edge-main">

    <!-- Description -->
    <div class="desc-banner">
      检测书签链接是否可访问。<strong>确定失效</strong>=404/410，<strong>疑似失效</strong>=其他 4xx/5xx 或网络问题（超时/DNS/连接/TLS）。网络不通可能是服务器出站/代理问题，请确认后再删。
    </div>

    <!-- Progress -->
    <div class="progress-area" v-if="total > 0 || checking">
      <div class="progress-text">
        已检测 {{ done }} / {{ total }}，发现失效 {{ deadList.length + suspList.length }} 个
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" :style="{ width: total > 0 ? (done / total * 100) + '%' : '0%' }"></div>
      </div>
    </div>

    <!-- Empty: Not started -->
    <div class="empty-state" v-if="!checking && total === 0">
      <div class="empty-icon">🔗</div>
      <div class="empty-title">开始检测失效书签</div>
      <div class="empty-desc">点击下方"开始检测"按钮，系统将逐批检测书签链接的可访问性</div>
    </div>

    <!-- Empty: All good -->
    <div class="empty-state" v-if="!checking && total > 0 && deadList.length === 0 && suspList.length === 0">
      <div class="empty-icon">✅</div>
      <div class="empty-title">没有发现失效书签</div>
      <div class="empty-desc">所有书签链接均可正常访问</div>
    </div>

    <!-- View Toggle -->
    <div class="view-seg" v-if="deadList.length > 0 || suspList.length > 0">
      <button :class="{ active: viewMode === 'severity' }" @click="viewMode = 'severity'">按失效程度</button>
      <button :class="{ active: viewMode === 'status' }" @click="viewMode = 'status'">按状态码</button>
    </div>

    <!-- 按失效程度 -->
    <template v-if="viewMode === 'severity'">
      <!-- Dead Section (default checked) -->
      <div v-if="deadList.length > 0">
        <div class="section-title">
          <span class="section-badge dead-badge">确定失效</span>
          <span class="section-count">{{ deadList.length }} 个</span>
        </div>
        <div class="deadlink-card" v-for="row in deadList" :key="row.id">
          <div class="card-top">
            <input type="checkbox" v-model="row.checked" class="card-checkbox" />
            <img v-if="row.favicon_url" :src="row.favicon_url" class="card-favicon" @error="$event.target.style.display='none'" />
            <span v-else class="card-favicon-placeholder">🔗</span>
            <div class="card-title">{{ row.title }}</div>
          </div>
          <a :href="row.url" target="_blank" rel="noopener noreferrer" class="card-url">{{ row.url }}</a>
          <div class="card-path">📁 {{ row.path || '/' }}</div>
          <span class="card-reason dead-reason">{{ row.reason }}</span>
          <button class="card-delete-btn" @click="deleteOne(row)">删除</button>
        </div>
      </div>

      <!-- Suspicious Section (default unchecked) -->
      <div v-if="suspList.length > 0">
        <div class="section-title">
          <span class="section-badge susp-badge">疑似失效</span>
          <span class="section-count">{{ suspList.length }} 个</span>
        </div>
        <div class="deadlink-card" v-for="row in suspList" :key="row.id">
          <div class="card-top">
            <input type="checkbox" v-model="row.checked" class="card-checkbox" />
            <img v-if="row.favicon_url" :src="row.favicon_url" class="card-favicon" @error="$event.target.style.display='none'" />
            <span v-else class="card-favicon-placeholder">🔗</span>
            <div class="card-title">{{ row.title }}</div>
          </div>
          <a :href="row.url" target="_blank" rel="noopener noreferrer" class="card-url">{{ row.url }}</a>
          <div class="card-path">📁 {{ row.path || '/' }}</div>
          <span class="card-reason susp-reason">{{ row.reason }}</span>
          <button class="card-delete-btn" @click="deleteOne(row)">删除</button>
        </div>
      </div>
    </template>

    <!-- 按状态码 -->
    <template v-else>
      <div v-for="group in statusGroups" :key="group.key">
        <div class="group-title">
          <span class="section-badge" :style="{ background: group.dead ? 'var(--danger)' : '#f59e0b', color: '#fff' }">{{ group.code ? group.code : '—' }}</span>
          <span class="section-count">{{ group.label }} · {{ group.rows.length }} 个</span>
          <div class="group-actions">
            <button class="group-btn" @click="selectGroup(group)">{{ group.rows.every(r => r.checked) ? '取消' : '全选' }}</button>
            <button class="group-btn danger" @click="deleteGroup(group)">删除本组</button>
          </div>
        </div>
        <div class="deadlink-card" v-for="row in group.rows" :key="row.id">
          <div class="card-top">
            <input type="checkbox" v-model="row.checked" class="card-checkbox" />
            <img v-if="row.favicon_url" :src="row.favicon_url" class="card-favicon" @error="$event.target.style.display='none'" />
            <span v-else class="card-favicon-placeholder">🔗</span>
            <div class="card-title">{{ row.title }}</div>
          </div>
          <a :href="row.url" target="_blank" rel="noopener noreferrer" class="card-url">{{ row.url }}</a>
          <div class="card-path">📁 {{ row.path || '/' }}</div>
          <span class="card-reason" :class="group.dead ? 'dead-reason' : 'susp-reason'">{{ row.reason }}</span>
          <button class="card-delete-btn" @click="deleteOne(row)">删除</button>
        </div>
      </div>
    </template>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <div class="bottom-bar-row" v-if="deadList.length > 0 || suspList.length > 0">
      <button class="bar-btn secondary" @click="toggleSelectAll">
        {{ allSelected ? '取消全选' : '全选' }}
      </button>
      <button class="bar-btn danger" @click="deleteSelected" :disabled="selectedCount === 0">
        删除选中 ({{ selectedCount }})
      </button>
      <button class="bar-btn danger" @click="deleteAllDead" :disabled="deadList.length === 0">
        删除全部确定失效 ({{ deadList.length }})
      </button>
    </div>
    <div class="bottom-bar-row">
      <button class="bar-btn primary" v-if="!checking" @click="startCheck">开始检测</button>
      <button class="bar-btn stop" v-if="checking" @click="stopCheck">停止检测</button>
    </div>
  </div>

  <!-- Toast -->
  <transition name="fade">
    <div v-if="toast.visible" :class="['toast', toast.type]" @click="dismissToast">
      {{ toast.message }}
    </div>
  </transition>
</div>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      token: localStorage.getItem('token') || null,
      checking: false,
      stopped: false,
      total: 0,
      done: 0,
      deadList: [],
      suspList: [],
      viewMode: 'severity',
      toast: { visible: false, message: '', type: 'success', timer: null },
    };
  },
  computed: {
    isDark() {
      return document.documentElement.getAttribute('data-theme') === 'dark';
    },
    selectedCount() {
      return [...this.deadList, ...this.suspList].filter(x => x.checked).length;
    },
    allSelected() {
      const all = [...this.deadList, ...this.suspList];
      return all.length > 0 && all.every(x => x.checked);
    },
    // 按状态码/网络错误类型归组：HTTP 按 code；网络错误(code 0)按 error_type 拆分
    statusGroups() {
      const map = new Map();
      for (const r of [...this.deadList, ...this.suspList]) {
        const key = (r.code && r.code !== 0)
          ? 'http:' + r.code
          : 'err:' + (r.error_type || 'unknown');
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(r);
      }
      const rank = { timeout: 1, dns: 2, connection: 3, tls: 4, unknown: 5 };
      return [...map.entries()]
        .sort((a, b) => {
          const [ka, kb] = [a[0], b[0]];
          const aErr = ka.startsWith('err:');
          const bErr = kb.startsWith('err:');
          if (aErr !== bErr) return aErr ? -1 : 1;
          if (aErr) {
            const ta = ka.slice(4), tb = kb.slice(4);
            return (rank[ta] || 9) - (rank[tb] || 9);
          }
          return Number(ka.slice(5)) - Number(kb.slice(5));
        })
        .map(([key, rows]) => {
          if (key.startsWith('http:')) {
            const code = Number(key.slice(5));
            return { key, code, error_type: '', rows, label: this.statusLabel(code), dead: this.isDeadCode(code) };
          }
          const et = key.slice(4);
          return { key, code: 0, error_type: et, rows, label: this.errorLabel(et), dead: false };
        });
    },
  },
  methods: {
    goBack() { window.location.href = '/mobile.html'; },

    toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('bm-theme', next);
    },

    async checkAuth() {
      const token = localStorage.getItem('token');
      if (token) { this.token = token; return true; }
      try {
        const r = await fetch('/api/config/system');
        if (r.ok) {
          const d = await r.json();
          if (d.require_login === 'false') return true;
        }
      } catch (e) { console.error('checkAuth error:', e); }
      window.location.href = '/login.html';
      return false;
    },

    authHeaders() {
      const h = { 'Content-Type': 'application/json' };
      const t = localStorage.getItem('token');
      if (t) h['Authorization'] = t;
      return h;
    },

    async loadBookmarks() {
      const r = await fetch('/api/tree', { headers: this.authHeaders() });
      const data = await r.json();
      const out = [];
      const walk = (nodes, path) => {
        for (const n of nodes || []) {
          if (n.type === 'folder') {
            walk(n.children, path + '/' + n.title);
          } else if (n.url) {
            out.push({ id: n.id, title: n.title, url: n.url, favicon_url: n.favicon_url, path: path || '/' });
          }
        }
      };
      walk(Array.isArray(data) ? data : (data.children || []), '');
      return out;
    },

    async startCheck() {
      this.checking = true;
      this.stopped = false;
      this.deadList = [];
      this.suspList = [];
      this.total = 0;
      this.done = 0;
      let all;
      try {
        all = await this.loadBookmarks();
      } catch (e) {
        console.error('加载书签失败', e);
        this.showToast('加载书签失败，请重试', 'error');
        this.checking = false;
        return;
      }
      this.total = all.length;
      const byId = Object.fromEntries(all.map(b => [b.id, b]));
      const BATCH = 20;
      for (let i = 0; i < all.length; i += BATCH) {
        if (this.stopped) break;
        const batch = all.slice(i, i + BATCH).map(b => ({ id: b.id, url: b.url }));
        try {
          const r = await fetch('/api/check-links', {
            method: 'POST', headers: this.authHeaders(),
            body: JSON.stringify({ bookmarks: batch }),
          });
          const resp = await r.json();
          for (const res of (resp.data?.results || [])) {
            const b = byId[res.id];
            if (!b) continue;
            const row = { ...b, code: res.code, reason: res.reason, error_type: res.error_type || '', checked: res.category === 'dead' };
            if (res.category === 'dead') this.deadList.push(row);
            else if (res.category === 'suspicious') this.suspList.push(row);
          }
        } catch (e) {
          console.error('batch failed', e);
        }
        this.done = Math.min(i + BATCH, all.length);
      }
      this.checking = false;
      if (!this.stopped) {
        this.done = this.total;
        const found = this.deadList.length + this.suspList.length;
        if (found > 0) {
          this.showToast(`检测完成，发现 ${found} 个失效书签`, 'warning');
        } else {
          this.showToast('检测完成，所有书签均正常', 'success');
        }
      }
    },

    stopCheck() { this.stopped = true; },

    statusLabel(code) {
      const m = {
        0: '无法连接',
        301: '永久重定向', 302: '临时重定向', 307: '临时重定向', 308: '永久重定向',
        401: '未授权', 403: '禁止访问', 404: '链接不存在', 408: '请求超时', 410: '已永久删除',
        429: '请求过多',
        500: '服务器错误', 502: '网关错误', 503: '服务不可用', 504: '网关超时'
      };
      return m[code] || ('HTTP ' + code);
    },
    errorLabel(errorType) {
      const m = {
        timeout: '超时',
        dns: 'DNS 解析失败',
        connection: '连接失败',
        tls: 'TLS/证书错误',
        unknown: '网络错误'
      };
      return m[errorType] || '网络错误';
    },
    isDeadCode(code) {
      return code === 404 || code === 410;
    },

    async deleteOne(row) {
      if (!confirm('确定删除该书签？\n' + row.title)) return;
      const r = await fetch('/api/nodes/' + row.id, { method: 'DELETE', headers: this.authHeaders() });
      if (r.ok) {
        this.removeIds([row.id]);
        this.showToast('删除成功', 'success');
      } else {
        this.showToast('删除失败', 'error');
      }
    },

    async deleteSelected() {
      const ids = [...this.deadList, ...this.suspList].filter(x => x.checked).map(x => x.id);
      if (ids.length === 0) { alert('未选中任何书签'); return; }
      if (!confirm('确定删除选中的 ' + ids.length + ' 个书签？')) return;
      await this.batchDelete(ids);
    },

    async deleteAllDead() {
      const ids = this.deadList.map(x => x.id);
      if (ids.length === 0) { alert('没有确定失效的书签'); return; }
      if (!confirm('确定删除全部 ' + ids.length + ' 个确定失效的书签？')) return;
      await this.batchDelete(ids);
    },

    selectGroup(group) {
      const target = !group.rows.every(r => r.checked);
      group.rows.forEach(r => r.checked = target);
    },

    async deleteGroup(group) {
      const ids = group.rows.map(r => r.id);
      if (ids.length === 0) return;
      if (!confirm('确定删除「' + group.label + '」分组的 ' + ids.length + ' 个书签？')) return;
      await this.batchDelete(ids);
    },

    async batchDelete(ids) {
      const r = await fetch('/api/nodes/batch-delete', {
        method: 'POST', headers: this.authHeaders(),
        body: JSON.stringify({ ids }),
      });
      if (r.ok) {
        this.removeIds(ids);
        this.showToast('批量删除成功', 'success');
      } else {
        this.showToast('批量删除失败', 'error');
      }
    },

    removeIds(ids) {
      const set = new Set(ids);
      this.deadList = this.deadList.filter(x => !set.has(x.id));
      this.suspList = this.suspList.filter(x => !set.has(x.id));
    },

    toggleSelectAll() {
      const target = !this.allSelected;
      this.deadList.forEach(x => x.checked = target);
      this.suspList.forEach(x => x.checked = target);
    },

    showToast(message, type = 'success') {
      if (this.toast.timer) { clearTimeout(this.toast.timer); this.toast.timer = null; }
      this.toast.visible = true;
      this.toast.message = message;
      this.toast.type = type;
      if (type === 'error') return;
      const duration = type === 'warning' ? 3500 : 2200;
      this.toast.timer = setTimeout(() => { this.toast.visible = false; this.toast.timer = null; }, duration);
    },

    dismissToast() {
      if (this.toast.timer) { clearTimeout(this.toast.timer); this.toast.timer = null; }
      this.toast.visible = false;
    },
  },
  async mounted() {
    const t = localStorage.getItem('bm-theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
    await this.checkAuth();
  },
}).mount('#app');
</script>
</body>
</html>
