<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>绑定飞牛 NAS 账号 · 书签</title>
  <script src="js/md5.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f0f2f8; --orb1: rgba(99,102,241,.18); --orb2: rgba(6,182,212,.14);
      --card: rgba(255,255,255,.94); --border: rgba(0,0,0,.08); --text: #1a1a2e;
      --sub: #666685; --muted: #9090b0; --input: #f4f5fb; --accent: #6366f1;
      --grad: linear-gradient(135deg,#6366f1,#06b6d4); --error-bg: rgba(244,63,94,.08);
      --error-border: rgba(244,63,94,.18); --error: #e11d48; --info-bg: rgba(99,102,241,.08);
      --info-border: rgba(99,102,241,.18); --shadow: 0 24px 64px rgba(99,102,241,.13);
    }
    [data-theme="dark"] {
      --bg: #0d0d1a; --orb1: rgba(99,102,241,.28); --orb2: rgba(6,182,212,.22);
      --card: rgba(15,15,29,.94); --border: rgba(255,255,255,.09); --text: #e8e8f0;
      --sub: #9898b4; --muted: #696986; --input: rgba(255,255,255,.055);
      --error-bg: rgba(244,63,94,.10); --error-border: rgba(244,63,94,.20); --error: #f87171;
      --info-bg: rgba(99,102,241,.13); --info-border: rgba(129,140,248,.24); --shadow: 0 30px 80px rgba(0,0,0,.48);
    }
    html, body { min-height: 100%; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background: var(--bg); color: var(--text); }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 28px 20px; position: relative; }
    body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(ellipse 65% 55% at 15% 45%,var(--orb1),transparent 62%),radial-gradient(ellipse 55% 45% at 85% 65%,var(--orb2),transparent 58%); pointer-events: none; }
    .page { position: relative; z-index: 1; width: 100%; max-width: 620px; }
    .brand { display: flex; align-items: center; justify-content: center; gap: 11px; margin-bottom: 20px; font-size: 17px; font-weight: 700; }
    .brand-icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--grad); box-shadow: 0 8px 24px rgba(99,102,241,.28); }
    .brand-icon svg { width: 20px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .card { padding: 38px; border-radius: 22px; background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); backdrop-filter: blur(20px); }
    h1 { font-size: 25px; letter-spacing: -.02em; text-align: center; }
    .lead { margin: 8px auto 24px; color: var(--sub); font-size: 14px; line-height: 1.65; text-align: center; }
    .identity { display: flex; gap: 12px; align-items: center; padding: 14px 16px; margin-bottom: 20px; border: 1px solid var(--info-border); border-radius: 12px; background: var(--info-bg); }
    .identity-dot { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--grad); color: #fff; font-size: 15px; font-weight: 700; }
    .identity-label { color: var(--muted); font-size: 12px; margin-bottom: 2px; }
    .identity-name { font-size: 15px; font-weight: 600; word-break: break-all; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; margin-bottom: 20px; border-radius: 11px; background: var(--input); }
    .tab { height: 40px; border: 0; border-radius: 8px; background: transparent; color: var(--sub); font: inherit; font-size: 14px; cursor: pointer; }
    .tab.active { background: var(--card); color: var(--accent); font-weight: 650; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .field { margin-bottom: 15px; }
    label { display: block; margin-bottom: 7px; color: var(--sub); font-size: 13px; font-weight: 550; }
    input { width: 100%; height: 46px; padding: 0 14px; border: 1px solid var(--border); border-radius: 10px; outline: none; background: var(--input); color: var(--text); font: inherit; font-size: 14px; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.14); }
    .hint { margin-top: -5px; margin-bottom: 15px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .status { display: none; padding: 11px 13px; margin-bottom: 16px; border-radius: 9px; color: var(--error); background: var(--error-bg); border: 1px solid var(--error-border); font-size: 13px; line-height: 1.5; }
    .status.show { display: block; }
    .submit { width: 100%; height: 46px; border: 0; border-radius: 10px; background: var(--grad); color: #fff; font: inherit; font-size: 14px; font-weight: 650; cursor: pointer; box-shadow: 0 6px 18px rgba(99,102,241,.28); }
    .submit:disabled { opacity: .55; cursor: not-allowed; }
    .back { display: block; margin-top: 18px; color: var(--accent); font-size: 13px; text-align: center; text-decoration: none; }
    .theme { position: fixed; z-index: 2; top: 20px; right: 20px; width: 38px; height: 38px; border: 1px solid var(--border); border-radius: 50%; background: var(--card); color: var(--sub); cursor: pointer; }
    @media (max-width: 560px) { .card { padding: 28px 22px; } h1 { font-size: 22px; } }
  </style>
</head>
<body>
  <button class="theme" id="theme" type="button" aria-label="切换主题">◐</button>
  <main class="page">
    <div class="brand">
      <span class="brand-icon"><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></span>
      <span>网址收藏夹</span>
    </div>
    <section class="card">
      <h1>绑定飞牛 NAS 账号</h1>
      <p class="lead">首次一键登录需要关联一个网址收藏夹账户，完成后从飞牛桌面打开即可直接登录。</p>

      <div class="identity">
        <span class="identity-dot">NAS</span>
        <div><div class="identity-label">当前飞牛 NAS 用户</div><div class="identity-name" id="fnos-name">正在获取登录信息…</div></div>
      </div>

      <div class="tabs">
        <button class="tab active" type="button" data-mode="register">创建新账户</button>
        <button class="tab" type="button" data-mode="bind">绑定已有账户</button>
      </div>

      <div class="status" id="status" role="alert"></div>
      <form id="bind-form" autocomplete="on">
        <div class="field">
          <label for="username">网址收藏夹用户名</label>
          <input id="username" type="text" required autocomplete="username" placeholder="请输入应用用户名">
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" type="password" required autocomplete="new-password" placeholder="至少 6 位">
        </div>
        <div class="field" id="confirm-field">
          <label for="confirm-password">确认密码</label>
          <input id="confirm-password" type="password" autocomplete="new-password" placeholder="请再次输入密码">
        </div>
        <p class="hint" id="mode-hint">将创建一个新账户，并与当前飞牛 NAS 用户绑定。</p>
        <button class="submit" id="submit" type="submit" disabled>创建并绑定</button>
      </form>
      <a class="back" href="login.html?force=1">返回普通账号登录</a>
    </section>
  </main>

  <script>
  (function () {
    const root = document.documentElement;
    const key = 'auth_theme';
    const systemTheme = () => matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    root.setAttribute('data-theme', localStorage.getItem(key) || systemTheme());
    document.getElementById('theme').addEventListener('click', function () {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem(key, next);
    });
  })();

  document.addEventListener('DOMContentLoaded', async function () {
    const form = document.getElementById('bind-form');
    const username = document.getElementById('username');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirm-password');
    const confirmField = document.getElementById('confirm-field');
    const submit = document.getElementById('submit');
    const status = document.getElementById('status');
    const fnosName = document.getElementById('fnos-name');
    const modeHint = document.getElementById('mode-hint');
    const fragment = new URLSearchParams(window.location.hash.slice(1));
    const fragmentTicket = fragment.get('fnos_ticket') || '';
    const fragmentGateway = fragment.get('fnos_gateway') || '';
    if (fragmentTicket) sessionStorage.setItem('fnos_ticket', fragmentTicket);
    if (fragmentGateway) {
      try {
        const gateway = new URL(fragmentGateway);
        if ((gateway.protocol === 'http:' || gateway.protocol === 'https:') &&
            gateway.hostname === window.location.hostname &&
            gateway.pathname.startsWith('/app/techfunway-bookmarks/')) {
          localStorage.setItem('fnos_gateway_url', gateway.href);
        }
      } catch (error) {}
    }
    if (window.location.hash) history.replaceState(null, '', window.location.pathname + window.location.search);
    const fnosTicket = sessionStorage.getItem('fnos_ticket') || '';
    let mode = 'register';

    function showStatus(message) {
      status.textContent = message;
      status.classList.add('show');
    }
    function completeLogin(data) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('currentUser', JSON.stringify(data.user));
      sessionStorage.removeItem('fnos_username');
      sessionStorage.removeItem('fnos_ticket');
      window.location.href = 'index.html';
    }
    function setMode(next) {
      mode = next;
      document.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('active', tab.dataset.mode === mode));
      const registering = mode === 'register';
      confirmField.hidden = !registering;
      confirmPassword.required = registering;
      password.autocomplete = registering ? 'new-password' : 'current-password';
      password.placeholder = registering ? '至少 6 位' : '请输入已有账户密码';
      submit.textContent = registering ? '创建并绑定' : '验证并绑定';
      modeHint.textContent = registering ? '将创建一个新账户，并与当前飞牛 NAS 用户绑定。' : '验证已有账户密码后，与当前飞牛 NAS 用户绑定。';
      status.classList.remove('show');
    }

    document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => setMode(tab.dataset.mode)));

    if (!fnosTicket) {
      fnosName.textContent = '未检测到飞牛登录凭证';
      showStatus('请从飞牛 NAS 桌面的“网址收藏夹”应用入口打开此页面。');
      return;
    }

    const cachedName = sessionStorage.getItem('fnos_username');
    if (cachedName) fnosName.textContent = cachedName;
    try {
      const response = await fetch('/api/auth/fnos/login', {
        method: 'POST',
        headers: { 'X-FnOS-Ticket': fnosTicket }
      });
      const data = await response.json();
      if (response.ok && data.token) { completeLogin(data); return; }
      if (!response.ok || !data.binding_required) {
        showStatus(data.error || '无法获取飞牛 NAS 登录信息，请从桌面应用入口重新打开。');
        fnosName.textContent = '获取失败';
        return;
      }
      fnosName.textContent = data.fnos_username || cachedName || '已登录用户';
      if (!username.value) username.value = data.fnos_username || '';
      sessionStorage.setItem('fnos_username', data.fnos_username || '');
      submit.disabled = false;
    } catch (error) {
      fnosName.textContent = '获取失败';
      showStatus('网络错误，无法获取飞牛 NAS 登录信息，请稍后重试。');
      return;
    }

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      status.classList.remove('show');
      const account = username.value.trim();
      const secret = password.value;
      if (!account || !secret) { showStatus('请输入网址收藏夹用户名和密码。'); return; }
      if (mode === 'register' && secret.length < 6) { showStatus('密码长度不能少于 6 位。'); return; }
      if (mode === 'register' && secret !== confirmPassword.value) { showStatus('两次输入的密码不一致。'); return; }
      submit.disabled = true;
      submit.textContent = mode === 'register' ? '正在创建并绑定…' : '正在验证并绑定…';
      try {
        const response = await fetch('/api/auth/fnos/bind', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-FnOS-Ticket': fnosTicket },
          body: JSON.stringify({ mode, username: account, password: MD5(secret) })
        });
        const data = await response.json();
        if (response.ok) { completeLogin(data); return; }
        showStatus(data.error || '绑定失败，请检查输入后重试。');
      } catch (error) {
        showStatus('网络错误，绑定失败，请稍后重试。');
      } finally {
        submit.disabled = false;
        submit.textContent = mode === 'register' ? '创建并绑定' : '验证并绑定';
      }
    });
  });
  </script>
</body>
</html>
