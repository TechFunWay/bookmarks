<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>去重复 - 网址收藏夹</title>
  <link rel="icon" href="/favicon.ico" />
  <script src="/vue.global.prod.js"></script>
  <style>
    /* ============ CSS Variables ============ */
    :root {
      --bg: #f3f3f3;
      --surface: #ffffff;
      --surface2: #f9f9f9;
      --surface3: #efefef;
      --border: #e0e0e0;
      --text: #1a1a1a;
      --text2: #444;
      --text3: #888;
      --primary: #0078d4;
      --primary-light: #e8f3fc;
      --primary-hover: #006cbd;
      --danger: #d13438;
      --danger-bg: #fde7e9;
      --shadow-sm: 0 1px 4px rgba(0,0,0,.08);
      --shadow-md: 0 4px 16px rgba(0,0,0,.12);
      --shadow-lg: 0 8px 32px rgba(0,0,0,.16);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --header-h: 56px;
    }
    [data-theme="dark"] {
      --bg: #1a1a1a;
      --surface: #242424;
      --surface2: #2c2c2c;
      --surface3: #363636;
      --border: #3a3a3a;
      --text: #f3f3f3;
      --text2: #ccc;
      --text3: #777;
      --primary: #2899f5;
      --primary-light: #1c2f40;
      --shadow-sm: 0 1px 4px rgba(0,0,0,.3);
      --shadow-md: 0 4px 16px rgba(0,0,0,.4);
      --shadow-lg: 0 8px 32px rgba(0,0,0,.5);
    }

    /* ============ Reset ============ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; border: none; background: none; font-family: inherit; color: inherit; }
    [v-cloak] { display: none !important; }

    /* ============ App Shell ============ */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* ============ Header ============ */
    .edge-header {
      flex-shrink: 0;
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
      z-index: 50;
    }
    .header-back {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      font-size: 18px;
      color: var(--text2);
      transition: background .15s;
    }
    .header-back:active { background: var(--surface3); }
    .header-title {
      flex: 1;
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-action {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      font-size: 18px;
      color: var(--text2);
      transition: background .15s;
    }
    .header-action:active { background: var(--surface3); }

    /* ============ Main Scroll Area ============ */
    .edge-main {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 12px 12px 100px;
    }

    /* ============ Stats Grid ============ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 8px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .stat-label {
      font-size: 11px;
      color: var(--text3);
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }
    .stat-value.highlight {
      color: var(--danger);
    }

    /* ============ Empty State ============ */
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--text3);
    }
    .empty-icon { font-size: 52px; margin-bottom: 16px; }
    .empty-title { font-size: 16px; font-weight: 600; color: var(--text2); margin-bottom: 8px; }
    .empty-desc { font-size: 13px; line-height: 1.6; }

    /* ============ Duplicate Card ============ */
    .duplicate-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 10px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .duplicate-card:active { box-shadow: var(--shadow-md); }
    .card-header {
      background: var(--surface2);
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .card-url {
      display: block;
      font-size: 13px;
      color: var(--primary);
      word-break: break-all;
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .count-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 10px;
      background: var(--danger);
      color: #fff;
    }
    .bookmark-item {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .bookmark-item:last-child {
      border-bottom: none;
    }
    .bm-title {
      font-weight: 500;
      color: var(--text);
      margin-bottom: 4px;
      word-break: break-all;
      line-height: 1.4;
      font-size: 14px;
    }
    .bm-path {
      font-size: 12px;
      color: var(--text3);
      margin-bottom: 8px;
      word-break: break-all;
    }
    .bm-delete-btn {
      padding: 8px;
      background: var(--danger-bg);
      color: var(--danger);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      width: 100%;
      cursor: pointer;
      transition: opacity .15s;
    }
    .bm-delete-btn:active { opacity: .7; }
    .bm-delete-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    /* ============ Bottom Bar ============ */
    .bottom-bar {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 200;
      box-shadow: 0 -2px 12px rgba(0,0,0,.08);
    }
    .bar-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
      text-align: center;
    }
    .bar-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }
    .bar-btn:active:not(:disabled) { opacity: .8; }
    .bar-btn.primary {
      background: var(--primary);
      color: #fff;
    }

    /* ============ Toast ============ */
    .toast {
      position: fixed;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      border-radius: 20px;
      color: #fff;
      font-size: 13px;
      z-index: 500;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: var(--shadow-md);
    }
    .toast.success { background: #107c10; }
    .toast.info { background: var(--primary); }
    .toast.warning { background: #ca5010; }
    .toast.error {
      background: var(--danger);
      pointer-events: all;
      border-radius: var(--radius-lg);
      padding: 14px 18px;
      max-width: 90vw;
      white-space: normal;
      text-align: center;
    }

    /* ============ Transitions ============ */
    .fade-enter-active, .fade-leave-active { transition: opacity .2s; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }
    .options-bar { background: var(--surface); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
    .options-label { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 8px; }
    .options-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .opt-chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 20px; background: var(--surface2); font-size: 12px; color: var(--text2); cursor: pointer; border: 1px solid var(--border); }
    .opt-chip.active { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
    .opt-chip input { margin: 0; width: 14px; height: 14px; accent-color: var(--primary); }
    .bm-checkbox { width: 18px; height: 18px; margin-right: 8px; accent-color: var(--primary); flex-shrink: 0; }
    .action-bar { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
    .bar-btn.small { padding: 6px 14px; font-size: 13px; border-radius: var(--radius-sm); }
    .dlg-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;}
    .dlg-box{background:var(--surface);border-radius:var(--radius-lg);padding:20px;margin:0 20px;max-width:360px;width:100%;box-shadow:var(--shadow-lg);}
    .dlg-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:8px;}
    .dlg-body{font-size:14px;color:var(--text2);line-height:1.6;white-space:pre-wrap;margin-bottom:16px;}
    .dlg-btns{display:flex;gap:8px;justify-content:flex-end;}

  </style>
</head>
<body>
<div id="app" v-cloak>

  <!-- Header -->
  <div class="edge-header">
    <button class="header-back" @click="goBack">
      <span>&#8592;</span>
    </button>
    <span class="header-title">去重复</span>
    <button class="header-action" @click="toggleTheme" title="切换主题">
      {{ isDark ? '☀️' : '🌙' }}
    </button>
  </div>

  <!-- Main Content -->
  <div class="edge-main">

    <!-- Stats Grid -->
    <div class="stats-grid" v-if="groups.length > 0 || checked">
      <div class="stat-box">
        <div class="stat-label">总书签</div>
        <div class="stat-value">{{ stats.total }}</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">重复网址</div>
        <div class="stat-value highlight">{{ stats.urls }}</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">重复书签</div>
        <div class="stat-value highlight">{{ stats.bookmarks }}</div>
      </div>
    </div>

    <!-- 重复判定选项 -->
    <div class="options-bar">
      <div class="options-label">重复判定规则：</div>
      <div class="options-list">
        <label class="opt-chip" :class="{ active: opts.ignoreScheme }"><input type="checkbox" v-model="opts.ignoreScheme" :disabled="checking"> HTTP和HTTPS计重复</label>
        <label class="opt-chip" :class="{ active: opts.ignoreWWW }"><input type="checkbox" v-model="opts.ignoreWWW" :disabled="checking"> www.与无www计重复</label>
        <label class="opt-chip" :class="{ active: opts.ignoreTrailingSlash }"><input type="checkbox" v-model="opts.ignoreTrailingSlash" :disabled="checking"> 末尾有无/计重复</label>
        <label class="opt-chip" :class="{ active: opts.ignoreQuery }"><input type="checkbox" v-model="opts.ignoreQuery" :disabled="checking"> ?后参数计重复</label>
        <label class="opt-chip" :class="{ active: opts.crossFolder }"><input type="checkbox" v-model="opts.crossFolder" :disabled="checking"> 不同文件夹计重复</label>
      </div>
    </div>

    <!-- Empty: Not started -->
    <div class="empty-state" v-if="!checking && !checked">
      <div class="empty-icon">🔍</div>
      <div class="empty-title">开始检查重复书签</div>
      <div class="empty-desc">点击下方"开始检测"按钮，系统将根据网址查找重复的书签</div>
    </div>

    <!-- Empty: No duplicates -->
    <div class="empty-state" v-if="!checking && checked && groups.length === 0">
      <div class="empty-icon">✅</div>
      <div class="empty-title">未发现重复书签</div>
      <div class="empty-desc">您的书签库很干净，没有重复的网址</div>
    </div>

    <!-- Duplicate Groups -->
      <div class="action-bar" v-if="groups.length">
        <button class="bar-btn secondary small" @click="toggleSelectAll">{{ allSelected ? "取消全选" : "全选" }}</button>
        <button class="bar-btn danger small" :disabled="selectedCount===0" @click="deleteSelected">删除选中 ({{ selectedCount }})</button>
        <button class="bar-btn danger small" @click="cleanAll">一键清理</button>
      </div>

    <div v-if="groups.length > 0">
      <div class="duplicate-card" v-for="(g, gi) in groups" :key="g.url">
        <div class="card-header">
          <a :href="g.url" target="_blank" rel="noopener noreferrer" class="card-url">{{ g.url }}</a>
          <span class="count-badge">{{ g.bookmarks.length }}个重复</span>
          <span class="scheme-badge" v-if="g.hasSchemeMismatch">⚠️ HTTP/HTTPS 混合</span>
        </div>
        <div class="bookmark-item" v-for="(bm, bi) in g.bookmarks" :key="bm.id">
          <input type="checkbox" v-model="bm.checked" class="bm-checkbox"> <div class="bm-title">{{ bm.title }}</div>
          <div class="bm-path">📁 {{ bm.path }}</div>
          <button class="bm-delete-btn" @click="deleteBm(g, gi, bi)" :disabled="bm.deleting">
            {{ bm.deleting ? '⏳ 删除中...' : '🗑️ 删除' }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <button class="bar-btn primary" @click="startCheck" :disabled="checking">
      {{ checking ? '⏳ 检查中...' : '开始检测' }}
    </button>
  </div>


    <!-- 确认弹窗 -->
    <transition name="fade">
      <div v-if="dlg.show" class="dlg-overlay" @click.self="dlg.show=false">
        <div class="dlg-box">
          <div class="dlg-title">{{ dlg.title }}</div>
          <div class="dlg-body">{{ dlg.message }}</div>
          <div class="dlg-btns">
            <button class="bar-btn secondary small" @click="dlg.show=false">取消</button>
            <button class="bar-btn danger small" @click="dlg.show=false; dlg.onOk()">确认删除</button>
          </div>
        </div>
      </div>
    </transition>

  <!-- Toast -->
  <transition name="fade">
    <div v-if="toast.visible" :class="['toast', toast.type]" @click="dismissToast">
      {{ toast.message }}
    </div>
  </transition>
</div>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      token: localStorage.getItem('token') || null,
      checking: false,
      checked: false,
      opts: { ignoreScheme: true, ignoreWWW: false, ignoreTrailingSlash: false, ignoreQuery: false, crossFolder: false },
      groups: [],
      stats: { total: 0, urls: 0, bookmarks: 0 },
      toast: { visible: false, message: '', type: 'success', timer: null },
      dlg: { show: false, title: "", message: "", onOk() {} },
    };
  },
  computed: {
    isDark() {
    },
    allSelected() {
      const all = this.groups.flatMap(g => g.bookmarks);
      return all.length > 0 && all.every(b => b.checked);
    },
    selectedCount() {
      return this.groups.flatMap(g => g.bookmarks).filter(b => b.checked).length;
    },
  },
  methods: {
    toggleSelectAll() {
      const target = !this.allSelected;
      this.groups.forEach(g => g.bookmarks.forEach(b => b.checked = target));
    },
    async deleteSelected() {
      const ids = this.groups.flatMap(g => g.bookmarks).filter(b => b.checked).map(b => b.id);
      if (ids.length === 0) { this.showToast("未选中任何书签", "warning"); return; }
      this.showConfirm("批量删除", "确定删除选中的 " + ids.length + " 个书签？", () => this.batchDelete(ids)); return;
      await this.batchDelete(ids);
    },
    async cleanAll() {
      const ids = this.groups.flatMap(g => g.bookmarks.slice(1)).map(b => b.id);
      if (ids.length === 0) { this.showToast("没有可清理的重复书签", "warning"); return; }
      
      this.showConfirm("一键清理", "确定一键清理 " + ids.length + " 个重复书签？\n每组将保留一个，其余全部删除。", () => this.batchDelete(ids)); return;
      await this.batchDelete(ids);
    },
    async batchDelete(ids) {
      const r = await fetch("/api/nodes/batch-delete", {
        method: "POST", headers: this.authHeaders(),
        body: JSON.stringify({ ids }),
      });
      if (r.ok) {
        const set = new Set(ids);
        this.groups = this.groups.map(g => ({
          ...g, bookmarks: g.bookmarks.filter(b => !set.has(b.id)),
        })).filter(g => g.bookmarks.length > 1);
      } else { this.showToast("批量删除失败", "error"); }
    },

    goBack() { window.location.href = '/mobile.html'; },

    toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('bm-theme', next);
    },

    async checkAuth() {
      const token = localStorage.getItem('token');
      if (token) { this.token = token; return true; }
      try {
        const r = await fetch('/api/config/system');
        if (r.ok) {
          const d = await r.json();
          if (d.require_login === 'false') return true;
        }
      } catch (e) { console.error('checkAuth error:', e); }
      window.location.href = '/login.html';
      return false;
    },

    authHeaders() {
      const h = { 'Content-Type': 'application/json' };
      const t = localStorage.getItem('token');
      if (t) h['Authorization'] = t;
      return h;
    },

    async startCheck() {
      this.checking = true;
      this.checked = false;
      this.groups = [];

      try {
        const params = new URLSearchParams();
        if (this.opts.ignoreScheme) params.set('ignore_scheme', 'true');
        if (this.opts.ignoreWWW) params.set('ignore_www', 'true');
        if (this.opts.ignoreTrailingSlash) params.set('ignore_trailing_slash', 'true');
        if (this.opts.ignoreQuery) params.set('ignore_query', 'true');
        if (this.opts.crossFolder) params.set('cross_folder', 'true');
        const r = await fetch('/api/check-duplicates?' + params.toString(), {
          headers: this.authHeaders(),
        });
        const data = await r.json();

        if (data.success) {
          this.groups = (data.data.duplicates || []).map(x => ({ url: x.url, hasSchemeMismatch: x.hasSchemeMismatch, bookmarks: (x.bookmarks || []).map((b, i) => ({ ...b, checked: i > 0 })) }));
          this.stats = {
            total: data.data.totalBookmarks || 0,
            urls: data.data.duplicateCount || 0,
            bookmarks: data.data.duplicateBookmarksCount || 0,
          };
          this.checked = true;
          if (this.groups.length > 0) {
            this.showToast(`发现 ${this.stats.urls} 个重复网址`, 'warning');
          } else {
            this.showToast('未发现重复书签', 'success');
          }
        } else {
          this.showToast('检查失败: ' + (data.message || '未知错误'), 'error');
        }
      } catch (e) {
        console.error('check duplicates error:', e);
        this.showToast('检查失败，请重试', 'error');
      } finally {
        this.checking = false;
      }
    },

    async deleteBm(group, groupIndex, bmIndex) {
      const bm = group.bookmarks[bmIndex];
      if (!bm || !bm.id) return;
      this.showConfirm('删除书签', '确定删除「' + bm.title + '」？', () => this._doDeleteBm(group, groupIndex, bmIndex));
    },

    async _doDeleteBm(group, groupIndex, bmIndex) {
      const bm = group.bookmarks[bmIndex];
      bm.deleting = true;
      try {
        const r = await fetch('/api/nodes/' + bm.id, {
          method: 'DELETE',
          headers: this.authHeaders(),
        });
        if (r.ok) {
          group.bookmarks.splice(bmIndex, 1);
          if (group.bookmarks.length <= 1) {
            this.groups.splice(groupIndex, 1);
            this.stats.urls--;
          }
          this.stats.bookmarks--;
          this.stats.total--;
          this.showToast('删除成功', 'success');
        } else {
          this.showToast('删除失败', 'error');
          bm.deleting = false;
        }
      } catch (e) {
        console.error('delete error:', e);
        this.showToast('删除失败，请重试', 'error');
        bm.deleting = false;
      }
    },

    showConfirm(title, msg, onOk) {
      this.dlg = { show: true, title, message: msg, onOk };
    },

    showToast(message, type = 'success') {
      if (this.toast.timer) { clearTimeout(this.toast.timer); this.toast.timer = null; }
      this.toast.visible = true;
      this.toast.message = message;
      this.toast.type = type;
      if (type === 'error') return;
      const duration = type === 'warning' ? 3500 : 2200;
      this.toast.timer = setTimeout(() => { this.toast.visible = false; this.toast.timer = null; }, duration);
    },

    dismissToast() {
      if (this.toast.timer) { clearTimeout(this.toast.timer); this.toast.timer = null; }
      this.toast.visible = false;
    },
  },
  async mounted() {
    const t = localStorage.getItem('bm-theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
    await this.checkAuth();
  },
}).mount('#app');
</script>
</body>
</html>
