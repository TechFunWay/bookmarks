<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>清理失效书签 - 网址收藏夹</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/vue.global.prod.js"></script>
  <script defer src="/app.js"></script>
</head>
<body style="background: url(/img/background.jpg); background-size: cover;">
<div id="app" v-cloak>

  <header class="app-header">
    <h1>清理失效书签<span class="subtitle-artistic">每天都很哇塞</span></h1>
    <div class="header-actions">
      <button class="primary" @click="startCheck" :disabled="checking">
        <span v-if="!checking">🔗</span>
        <span v-else>⏳</span>
        <span>{{ checking ? '检测中...' : '开始检测' }}</span>
      </button>
      <button class="danger" v-if="checking" @click="stopCheck">
        <span>⏹</span>
        <span>停止检测</span>
      </button>
      <button class="tertiary" @click="goBack">
        <span>🔙</span>
        <span>返回</span>
      </button>
      <div class="theme-toggle">
        <span class="theme-toggle-icon moon-icon">🌙</span>
        <div class="theme-toggle-btn" @click="toggleTheme"></div>
        <span class="theme-toggle-icon sun-icon">☀️</span>
      </div>
    </div>
  </header>

  <main class="app-main">
    <div class="deadlinks-container">

      <!-- 说明文案 -->
      <div class="desc-banner">
        检测书签链接是否可访问。<strong>确定失效</strong>=404/410，<strong>疑似失效</strong>=其他 4xx/5xx 或网络问题（超时/DNS/连接/TLS）。网络不通可能是服务器出站/代理问题，请确认后再删。
      </div>

      <!-- 进度条 -->
      <div class="progress-area" v-if="total > 0 || checking">
        <div class="progress-text">
          已检测 {{ done }} / {{ total }}，发现失效 {{ deadList.length + suspList.length }} 个
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" :style="{ width: total > 0 ? (done / total * 100) + '%' : '0%' }"></div>
        </div>
      </div>

      <!-- 空状态 -->
      <div class="empty-state" v-if="!checking && total === 0">
        <div class="empty-icon">🔗</div>
        <h3>开始检测失效书签</h3>
        <p>点击上方"开始检测"按钮，系统将逐批检测书签链接的可访问性</p>
      </div>

      <!-- 全部正常 -->
      <div class="empty-state" v-if="!checking && total > 0 && deadList.length === 0 && suspList.length === 0">
        <div class="empty-icon">✅</div>
        <h3>没有发现失效书签</h3>
        <p>所有书签链接均可正常访问</p>
      </div>

      <!-- 批量操作栏 -->
      <div class="batch-bar" v-if="deadList.length > 0 || suspList.length > 0">
        <div class="view-seg">
          <button :class="{ active: viewMode === 'severity' }" @click="viewMode = 'severity'">按失效程度</button>
          <button :class="{ active: viewMode === 'status' }" @click="viewMode = 'status'">按状态码</button>
        </div>
        <button class="secondary" @click="toggleSelectAll">
          {{ allSelected ? '取消全选' : '全选' }}
        </button>
        <button class="danger" @click="deleteSelected" :disabled="selectedCount === 0">
          删除选中 ({{ selectedCount }})
        </button>
        <button class="danger" @click="deleteAllDead" :disabled="deadList.length === 0">
          一键删除全部确定失效 ({{ deadList.length }})
        </button>
      </div>

      <!-- 按失效程度 -->
      <template v-if="viewMode === 'severity'">
        <!-- 确定失效 -->
        <div v-if="deadList.length > 0" class="result-section">
          <div class="section-header dead">
            <span class="section-badge dead-badge">确定失效</span>
            <span class="section-count">{{ deadList.length }} 个</span>
          </div>
          <div class="bookmark-list">
            <div class="bookmark-row" v-for="row in deadList" :key="row.id">
              <input type="checkbox" v-model="row.checked" class="row-checkbox" />
              <img v-if="row.favicon_url" :src="row.favicon_url" class="row-favicon" @error="$event.target.style.display='none'" />
              <span v-else class="row-favicon-placeholder">🔗</span>
              <div class="row-info">
                <div class="row-title">
                  <a :href="row.url" target="_blank" rel="noopener noreferrer">{{ row.title }}</a>
                </div>
                <div class="row-url">
                  <a :href="row.url" target="_blank" rel="noopener noreferrer" class="url-link">{{ row.url }}</a>
                </div>
                <div class="row-meta">
                  <span class="meta-item">📁 {{ row.path || '/' }}</span>
                  <span class="meta-item reason dead-reason">{{ row.reason }}</span>
                </div>
              </div>
              <button class="danger small" @click="deleteOne(row)">🗑️ 删除</button>
            </div>
          </div>
        </div>

        <!-- 疑似失效 -->
        <div v-if="suspList.length > 0" class="result-section">
          <div class="section-header susp">
            <span class="section-badge susp-badge">疑似失效</span>
            <span class="section-count">{{ suspList.length }} 个</span>
          </div>
          <div class="bookmark-list">
            <div class="bookmark-row" v-for="row in suspList" :key="row.id">
              <input type="checkbox" v-model="row.checked" class="row-checkbox" />
              <img v-if="row.favicon_url" :src="row.favicon_url" class="row-favicon" @error="$event.target.style.display='none'" />
              <span v-else class="row-favicon-placeholder">🔗</span>
              <div class="row-info">
                <div class="row-title">
                  <a :href="row.url" target="_blank" rel="noopener noreferrer">{{ row.title }}</a>
                </div>
                <div class="row-url">
                  <a :href="row.url" target="_blank" rel="noopener noreferrer" class="url-link">{{ row.url }}</a>
                </div>
                <div class="row-meta">
                  <span class="meta-item">📁 {{ row.path || '/' }}</span>
                  <span class="meta-item reason susp-reason">{{ row.reason }}</span>
                </div>
              </div>
              <button class="danger small" @click="deleteOne(row)">🗑️ 删除</button>
            </div>
          </div>
        </div>
      </template>

      <!-- 按状态码 -->
      <template v-else>
        <div v-for="group in statusGroups" :key="group.key" class="result-section">
          <div class="section-header" :class="group.dead ? 'dead' : 'susp'">
            <span class="section-badge" :class="group.dead ? 'dead-badge' : 'susp-badge'">{{ group.code ? group.code : '—' }} {{ group.label }}</span>
            <span class="section-count">{{ group.rows.length }} 个</span>
            <button class="secondary small" @click="selectGroup(group)">{{ group.rows.every(r => r.checked) ? '取消本组' : '全选本组' }}</button>
            <button class="danger small" @click="deleteGroup(group)">删除本组</button>
          </div>
          <div class="bookmark-list">
            <div class="bookmark-row" v-for="row in group.rows" :key="row.id">
              <input type="checkbox" v-model="row.checked" class="row-checkbox" />
              <img v-if="row.favicon_url" :src="row.favicon_url" class="row-favicon" @error="$event.target.style.display='none'" />
              <span v-else class="row-favicon-placeholder">🔗</span>
              <div class="row-info">
                <div class="row-title">
                  <a :href="row.url" target="_blank" rel="noopener noreferrer">{{ row.title }}</a>
                </div>
                <div class="row-url">
                  <a :href="row.url" target="_blank" rel="noopener noreferrer" class="url-link">{{ row.url }}</a>
                </div>
                <div class="row-meta">
                  <span class="meta-item">📁 {{ row.path || '/' }}</span>
                  <span class="meta-item reason" :class="group.dead ? 'dead-reason' : 'susp-reason'">{{ row.reason }}</span>
                </div>
              </div>
              <button class="danger small" @click="deleteOne(row)">🗑️ 删除</button>
            </div>
          </div>
        </div>
      </template>

    </div>
  </main>

  <!-- Toast 提示 -->
  <transition name="toast-fade">
    <div v-if="toast.visible && toast.type === 'error'" class="toast-overlay" @click="dismissToast"></div>
  </transition>
  <transition name="toast-fade">
    <div v-if="toast.visible && toast.type !== 'error'" :class="['toast', toast.type]" @click="dismissToast">
      {{ toast.message }}
    </div>
  </transition>
  <transition name="toast-fade">
    <div v-if="toast.visible && toast.type === 'error'" :class="['toast', 'error']" @click="dismissToast">
      <div class="toast-error-header">
        <span class="toast-error-icon">⚠️</span>
        <span class="toast-error-msg">{{ toast.message }}</span>
      </div>
      <button class="toast-error-close" @click.stop="dismissToast">知道了</button>
    </div>
  </transition>

</div>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      token: localStorage.getItem('token') || null,
      checking: false,
      stopped: false,
      total: 0,
      done: 0,
      deadList: [],
      suspList: [],
      viewMode: 'severity',
      toast: { visible: false, message: '', type: 'success', timer: null },
    };
  },
  computed: {
    selectedCount() {
      return [...this.deadList, ...this.suspList].filter(x => x.checked).length;
    },
    allSelected() {
      const all = [...this.deadList, ...this.suspList];
      return all.length > 0 && all.every(x => x.checked);
    },
    statusGroups() {
      const map = new Map();
      for (const r of [...this.deadList, ...this.suspList]) {
        const key = (r.code && r.code !== 0)
          ? 'http:' + r.code
          : 'err:' + (r.error_type || 'unknown');
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(r);
      }
      const rank = { timeout: 1, dns: 2, connection: 3, tls: 4, unknown: 5 };
      return [...map.entries()]
        .sort((a, b) => {
          const [ka, kb] = [a[0], b[0]];
          const aErr = ka.startsWith('err:');
          const bErr = kb.startsWith('err:');
          if (aErr !== bErr) return aErr ? -1 : 1;
          if (aErr) {
            const ta = ka.slice(4), tb = kb.slice(4);
            return (rank[ta] || 9) - (rank[tb] || 9);
          }
          return Number(ka.slice(5)) - Number(kb.slice(5));
        })
        .map(([key, rows]) => {
          if (key.startsWith('http:')) {
            const code = Number(key.slice(5));
            return { key, code, error_type: '', rows, label: this.statusLabel(code), dead: this.isDeadCode(code) };
          }
          const et = key.slice(4);
          return { key, code: 0, error_type: et, rows, label: this.errorLabel(et), dead: false };
        });
    },
  },
  methods: {
    async checkAuth() {
      const token = localStorage.getItem('token');
      if (token) { this.token = token; return true; }
      try {
        const r = await fetch('/api/config/system');
        if (r.ok) {
          const d = await r.json();
          if (d.require_login === 'false') return true;
        }
      } catch (e) { console.error('checkAuth error:', e); }
      window.location.href = '/login.html';
      return false;
    },

    goBack() { window.location.href = '/'; },

    toggleTheme() {
      const html = document.documentElement;
      const newTheme = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    },

    authHeaders() {
      const h = { 'Content-Type': 'application/json' };
      const t = localStorage.getItem('token');
      if (t) h['Authorization'] = t;
      return h;
    },

    async loadBookmarks() {
      const r = await fetch('/api/tree', { headers: this.authHeaders() });
      const data = await r.json();
      const out = [];
      const walk = (nodes, path) => {
        for (const n of nodes || []) {
          if (n.type === 'folder') {
            walk(n.children, path + '/' + n.title);
          } else if (n.url) {
            out.push({ id: n.id, title: n.title, url: n.url, favicon_url: n.favicon_url, path: path || '/' });
          }
        }
      };
      walk(Array.isArray(data) ? data : (data.children || []), '');
      return out;
    },

    async startCheck() {
      this.checking = true;
      this.stopped = false;
      this.deadList = [];
      this.suspList = [];
      this.total = 0;
      this.done = 0;
      let all;
      try {
        all = await this.loadBookmarks();
      } catch (e) {
        console.error('加载书签失败', e);
        this.showToast('加载书签失败，请重试', 'error');
        this.checking = false;
        return;
      }
      this.total = all.length;
      const byId = Object.fromEntries(all.map(b => [b.id, b]));
      const BATCH = 20;
      for (let i = 0; i < all.length; i += BATCH) {
        if (this.stopped) break;
        const batch = all.slice(i, i + BATCH).map(b => ({ id: b.id, url: b.url }));
        try {
          const r = await fetch('/api/check-links', {
            method: 'POST', headers: this.authHeaders(),
            body: JSON.stringify({ bookmarks: batch }),
          });
          const resp = await r.json();
          for (const res of (resp.data?.results || [])) {
            const b = byId[res.id];
            if (!b) continue;
            const row = { ...b, code: res.code, reason: res.reason, error_type: res.error_type || '', checked: res.category === 'dead' };
            if (res.category === 'dead') this.deadList.push(row);
            else if (res.category === 'suspicious') this.suspList.push(row);
          }
        } catch (e) {
          console.error('batch failed', e);
        }
        this.done = Math.min(i + BATCH, all.length);
      }
      this.checking = false;
      if (!this.stopped) {
        this.done = this.total;
        const found = this.deadList.length + this.suspList.length;
        if (found > 0) {
          this.showToast(`检测完成，发现 ${found} 个失效书签`, 'warning');
        } else {
          this.showToast('检测完成，所有书签均正常', 'success');
        }
      }
    },

    stopCheck() { this.stopped = true; },

    statusLabel(code) {
      const m = {
        0: '无法连接',
        301: '永久重定向', 302: '临时重定向', 307: '临时重定向', 308: '永久重定向',
        401: '未授权', 403: '禁止访问', 404: '链接不存在', 408: '请求超时', 410: '已永久删除',
        429: '请求过多',
        500: '服务器错误', 502: '网关错误', 503: '服务不可用', 504: '网关超时'
      };
      return m[code] || ('HTTP ' + code);
    },
    errorLabel(errorType) {
      const m = {
        timeout: '超时',
        dns: 'DNS 解析失败',
        connection: '连接失败',
        tls: 'TLS/证书错误',
        unknown: '网络错误'
      };
      return m[errorType] || '网络错误';
    },
    isDeadCode(code) {
      return code === 404 || code === 410;
    },

    async deleteOne(row) {
      if (!confirm('确定删除该书签？\n' + row.title)) return;
      const r = await fetch('/api/nodes/' + row.id, { method: 'DELETE', headers: this.authHeaders() });
      if (r.ok) {
        this.removeIds([row.id]);
        this.showToast('删除成功', 'success');
      } else {
        this.showToast('删除失败', 'error');
      }
    },

    async deleteSelected() {
      const ids = [...this.deadList, ...this.suspList].filter(x => x.checked).map(x => x.id);
      if (ids.length === 0) { alert('未选中任何书签'); return; }
      if (!confirm('确定删除选中的 ' + ids.length + ' 个书签？')) return;
      await this.batchDelete(ids);
    },

    async deleteAllDead() {
      const ids = this.deadList.map(x => x.id);
      if (ids.length === 0) { alert('没有确定失效的书签'); return; }
      if (!confirm('确定删除全部 ' + ids.length + ' 个确定失效的书签？')) return;
      await this.batchDelete(ids);
    },

    selectGroup(group) {
      const target = !group.rows.every(r => r.checked);
      group.rows.forEach(r => r.checked = target);
    },

    async deleteGroup(group) {
      const ids = group.rows.map(r => r.id);
      if (ids.length === 0) return;
      if (!confirm('确定删除「' + group.label + '」分组的 ' + ids.length + ' 个书签？')) return;
      await this.batchDelete(ids);
    },

    async batchDelete(ids) {
      const r = await fetch('/api/nodes/batch-delete', {
        method: 'POST', headers: this.authHeaders(),
        body: JSON.stringify({ ids }),
      });
      if (r.ok) {
        this.removeIds(ids);
        this.showToast('批量删除成功', 'success');
      } else {
        this.showToast('批量删除失败', 'error');
      }
    },

    removeIds(ids) {
      const set = new Set(ids);
      this.deadList = this.deadList.filter(x => !set.has(x.id));
      this.suspList = this.suspList.filter(x => !set.has(x.id));
    },

    toggleSelectAll() {
      const target = !this.allSelected;
      this.deadList.forEach(x => x.checked = target);
      this.suspList.forEach(x => x.checked = target);
    },

    showToast(message, type = 'success') {
      if (this.toast.timer) { clearTimeout(this.toast.timer); this.toast.timer = null; }
      this.toast.visible = true;
      this.toast.message = message;
      this.toast.type = type;
      if (type === 'error') return;
      const duration = type === 'warning' ? 3500 : 2200;
      this.toast.timer = setTimeout(() => { this.toast.visible = false; this.toast.timer = null; }, duration);
    },

    dismissToast() {
      if (this.toast.timer) { clearTimeout(this.toast.timer); this.toast.timer = null; }
      this.toast.visible = false;
    },
  },
  async mounted() {
    await this.checkAuth();
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  },
}).mount('#app');
</script>

<style>
.deadlinks-container {
  width: 100%;
  padding: 2rem;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.view-seg {
  display: inline-flex;
  background: var(--bg-elev-3, rgba(0,0,0,.06));
  border-radius: 8px;
  padding: 2px;
  gap: 2px;
}
.view-seg button {
  border: none;
  background: transparent;
  color: var(--text-secondary, #666);
  font-size: 13px;
  padding: 5px 12px;
  border-radius: 6px;
  cursor: pointer;
}
.view-seg button.active {
  background: var(--bg-elev-1, #fff);
  color: var(--text-primary, #111);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(0,0,0,.08);
}
.batch-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}
.section-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

/* 全局 style.css 把 html/body 设为 overflow:hidden，导致超出一屏的内容无法滚动；
   本页内容是纵向长列表，改为整页滚动。只让 html 作为滚动容器、body 保持
   overflow:visible，sticky 头部才能正确固定在顶部（若 body 也设为 auto，body
   会变成滚动容器导致头部跟着内容一起滚走）。 */
html {
  overflow-y: auto !important;
  height: auto !important;
}
body {
  overflow: visible !important;
  height: auto !important;
  min-height: 100vh;
}

.app-main {
  width: 100%;
  max-width: 100%;
  display: block !important;
  grid-template-columns: 1fr !important;
  gap: 0 !important;
  height: auto !important;
  overflow: visible !important;
}

/* 说明文案 */
.desc-banner {
  background: rgba(255, 255, 255, 0.9);
  border-left: 4px solid #f59e0b;
  border-radius: 8px;
  padding: 1rem 1.25rem;
  font-size: 0.95rem;
  color: #555;
  line-height: 1.6;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

[data-theme="dark"] .desc-banner {
  background: rgba(40, 40, 40, 0.92);
  color: #ccc;
  border-color: #d97706;
}

/* 进度区 */
.progress-area {
  background: rgba(255, 255, 255, 0.9);
  border-radius: 10px;
  padding: 1rem 1.25rem;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

[data-theme="dark"] .progress-area {
  background: rgba(40, 40, 40, 0.92);
}

.progress-text {
  font-size: 0.9rem;
  color: #555;
  margin-bottom: 0.5rem;
}

[data-theme="dark"] .progress-text {
  color: #aaa;
}

.progress-bar-wrap {
  height: 8px;
  background: #e5e7eb;
  border-radius: 4px;
  overflow: hidden;
}

[data-theme="dark"] .progress-bar-wrap {
  background: #374151;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #3b82f6, #60a5fa);
  border-radius: 4px;
  transition: width 0.3s ease;
}

/* 空状态 */
.empty-state {
  text-align: center;
  padding: 4rem 2rem;
}

.empty-icon {
  font-size: 4rem;
  margin-bottom: 1rem;
}

.empty-state h3 {
  font-size: 1.5rem;
  margin-bottom: 0.5rem;
  color: #333;
}

[data-theme="dark"] .empty-state h3 {
  color: #e0e0e0;
}

.empty-state p {
  color: #666;
}

[data-theme="dark"] .empty-state p {
  color: #aaa;
}

/* 批量操作栏 */
.batch-bar {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
  background: rgba(255, 255, 255, 0.9);
  border-radius: 10px;
  padding: 0.875rem 1.25rem;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
