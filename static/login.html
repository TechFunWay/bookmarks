<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 书签</title>
  <script src="js/md5.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens ── */
    :root {
      --bg:           #f0f2f8;
      --bg-orb1:      rgba(99,102,241,0.18);
      --bg-orb2:      rgba(6,182,212,0.14);
      --bg-orb3:      rgba(139,92,246,0.10);
      --brand-bg:     linear-gradient(145deg, rgba(99,102,241,0.12) 0%, rgba(6,182,212,0.07) 100%);
      --brand-border: rgba(99,102,241,0.12);
      --form-bg:      rgba(255,255,255,0.92);
      --form-border:  rgba(0,0,0,0.06);
      --card-shadow:  0 24px 64px rgba(99,102,241,0.12), 0 0 0 1px rgba(0,0,0,0.06);
      --text:         #1a1a2e;
      --text-sub:     #5a5a7a;
      --text-muted:   #9090b0;
      --input-bg:     #f4f5fb;
      --input-border: rgba(0,0,0,0.10);
      --input-focus:  #6366f1;
      --input-color:  #1a1a2e;
      --placeholder:  #b0b0cc;
      --icon-color:   #a0a0c0;
      --grad:         linear-gradient(135deg, #6366f1, #06b6d4);
      --accent:       #6366f1;
      --link:         #6366f1;
      --link-hover:   #4f46e5;
      --error-bg:     rgba(244,63,94,0.08);
      --error-border: rgba(244,63,94,0.18);
      --error-text:   #e11d48;
      --cb-border:    rgba(0,0,0,0.15);
      --cb-bg:        #fff;
      --remember-txt: #7070a0;
      --toggle-bg:    rgba(0,0,0,0.06);
      --toggle-hover: rgba(0,0,0,0.10);
      --toggle-icon:  #5a5a7a;
    }

    [data-theme="dark"] {
      --bg:           #0d0d1a;
      --bg-orb1:      rgba(99,102,241,0.28);
      --bg-orb2:      rgba(6,182,212,0.22);
      --bg-orb3:      rgba(139,92,246,0.15);
      --brand-bg:     linear-gradient(145deg, rgba(99,102,241,0.20) 0%, rgba(6,182,212,0.10) 100%);
      --brand-border: rgba(255,255,255,0.08);
      --form-bg:      rgba(10,10,22,0.88);
      --form-border:  rgba(255,255,255,0.06);
      --card-shadow:  0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.07);
      --text:         #e8e8f0;
      --text-sub:     #8a8aaa;
      --text-muted:   #5a5a78;
      --input-bg:     rgba(255,255,255,0.05);
      --input-border: rgba(255,255,255,0.09);
      --input-color:  #e0e0f0;
      --placeholder:  #3e3e5a;
      --icon-color:   #4a4a68;
      --link:         #818cf8;
      --link-hover:   #a5b4fc;
      --error-bg:     rgba(244,63,94,0.10);
      --error-border: rgba(244,63,94,0.20);
      --error-text:   #f87171;
      --cb-border:    rgba(255,255,255,0.12);
      --cb-bg:        rgba(255,255,255,0.04);
      --remember-txt: #6a6a88;
      --toggle-bg:    rgba(255,255,255,0.08);
      --toggle-hover: rgba(255,255,255,0.14);
      --toggle-icon:  #8a8aaa;
    }

    html, body {
      min-height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      transition: background .3s;
    }

    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; position: relative; overflow: hidden;
    }

    /* Background */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 70% 55% at 15% 50%, var(--bg-orb1) 0%, transparent 60%),
        radial-gradient(ellipse 55% 45% at 85% 60%, var(--bg-orb2) 0%, transparent 55%),
        radial-gradient(ellipse 45% 35% at 50% 5%, var(--bg-orb3) 0%, transparent 50%),
        var(--bg);
      transition: background .3s;
    }

    /* Theme toggle */
    .theme-btn {
      position: fixed; top: 20px; right: 20px; z-index: 100;
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--toggle-bg);
      border: 1px solid var(--brand-border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--toggle-icon);
      transition: background .2s, color .2s;
      backdrop-filter: blur(8px);
    }
    .theme-btn:hover { background: var(--toggle-hover); }
    .theme-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icon-sun, .icon-moon { position: absolute; transition: opacity .2s, transform .2s; }
    [data-theme="light"] .icon-moon { opacity: 0; transform: scale(.6); }
    [data-theme="light"] .icon-sun  { opacity: 1; transform: scale(1); }
    [data-theme="dark"]  .icon-sun  { opacity: 0; transform: scale(.6); }
    [data-theme="dark"]  .icon-moon { opacity: 1; transform: scale(1); }

    /* Card */
    .card {
      position: relative; z-index: 1;
      display: flex; width: 100%; max-width: 880px; min-height: 500px;
      border-radius: 24px; overflow: hidden;
      box-shadow: var(--card-shadow);
      transition: box-shadow .3s;
    }

    /* Brand side */
    .brand {
      flex: 1; padding: 48px 44px;
      background: var(--brand-bg);
      border-right: 1px solid var(--brand-border);
      display: flex; flex-direction: column; justify-content: center;
      transition: background .3s, border-color .3s;
    }

    .brand-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 44px; }
    .brand-logo-icon {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--grad);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 20px rgba(99,102,241,0.35);
      flex-shrink: 0;
    }
    .brand-logo-icon svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .brand-logo-name { font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }

    .brand-title { font-size: 32px; font-weight: 700; color: var(--text); line-height: 1.2; letter-spacing: -0.03em; margin-bottom: 12px; }
    .brand-title em { font-style: normal; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-desc { font-size: 14px; color: var(--text-sub); line-height: 1.7; margin-bottom: 40px; }

    .brand-feats { display: flex; flex-direction: column; gap: 13px; }
    .brand-feat { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-sub); }
    .feat-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--grad); flex-shrink: 0; }

    /* Form side */
    .form-side {
      width: 370px; flex-shrink: 0; padding: 48px 38px;
      background: var(--form-bg);
      border-left: 1px solid var(--form-border);
      backdrop-filter: blur(20px);
      display: flex; flex-direction: column; justify-content: center;
      transition: background .3s;
    }

    .form-title { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; margin-bottom: 4px; }
    .form-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 26px; }

    /* Alert */
    .alert { display: none; align-items: center; gap: 8px; padding: 10px 13px; border-radius: 9px; font-size: 13px; margin-bottom: 16px; background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text); }
    .alert.show { display: flex; }

    /* Fields */
    .field { margin-bottom: 14px; }
    .field-label { font-size: 12px; font-weight: 500; color: var(--text-sub); margin-bottom: 6px; display: block; }
    .field-wrap { position: relative; }

    .fi { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--icon-color); pointer-events: none; }
    .fi svg { width: 15px; height: 15px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .field-input {
      width: 100%; height: 44px;
      padding: 0 40px 0 40px;
      font-size: 14px; font-family: inherit;
      color: var(--input-color);
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px; outline: none;
      transition: border-color .2s, background .2s, box-shadow .2s, color .2s;
    }
    .field-input::placeholder { color: var(--placeholder); }
    .field-input:hover { border-color: rgba(99,102,241,0.3); }
    .field-input:focus { border-color: var(--input-focus); background: rgba(99,102,241,0.05); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }

    .pwd-btn {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
      color: var(--icon-color); background: none; border: none; cursor: pointer; border-radius: 6px; transition: color .15s;
    }
    .pwd-btn:hover { color: var(--text-sub); }
    .pwd-btn svg { width: 14px; height: 14px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Remember */
    .remember { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; cursor: pointer; }
    .cb-wrap { position: relative; width: 16px; height: 16px; flex-shrink: 0; }
    .cb-wrap input { position: absolute; opacity: 0; inset: 0; cursor: pointer; margin: 0; }
    .cb-box { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--cb-border); background: var(--cb-bg); display: flex; align-items: center; justify-content: center; transition: all .15s; pointer-events: none; }
    .cb-wrap input:checked ~ .cb-box { background: var(--accent); border-color: var(--accent); }
    .cb-check { opacity: 0; width: 10px; height: 10px; fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; transition: opacity .15s; }
    .cb-wrap input:checked ~ .cb-box .cb-check { opacity: 1; }
    .remember-lbl { font-size: 13px; color: var(--remember-txt); user-select: none; }

    /* Button */
    .btn {
      width: 100%; height: 44px; border: none; border-radius: 10px;
      background: var(--grad); color: #fff; font-size: 14px; font-weight: 600; font-family: inherit;
      cursor: pointer; box-shadow: 0 4px 16px rgba(99,102,241,0.35);
      transition: opacity .2s, transform .15s, box-shadow .2s;
    }
    .btn:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); box-shadow: 0 6px 22px rgba(99,102,241,0.45); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    /* Links */
    .links { margin-top: 18px; text-align: center; font-size: 13px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
    .links a { color: var(--link); text-decoration: none; font-weight: 500; transition: color .15s; }
    .links a:hover { color: var(--link-hover); }
    .links-sep { opacity: .3; }

    .login-divider { display: flex; align-items: center; gap: 10px; margin: 16px 0; color: var(--text-muted); font-size: 12px; }
    .login-divider::before, .login-divider::after { content: ''; height: 1px; flex: 1; background: var(--form-border); }
    .fnos-login { width: 100%; min-height: 44px; border: 1px solid var(--form-border); border-radius: 10px; background: transparent; color: var(--text); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .2s, border-color .2s; }
    .fnos-login:hover:not(:disabled) { background: rgba(99,102,241,.08); border-color: var(--accent); }
    .fnos-login:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .fnos-login:disabled { opacity: .55; cursor: not-allowed; }

    @media (max-width: 720px) {
      .brand { display: none; }
      .card { max-width: 420px; }
      .form-side { width: 100%; padding: 40px 28px; }
    }
  </style>
</head>
<body>
<div class="bg"></div>

<button class="theme-btn" id="themeBtn" aria-label="切换主题">
  <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="card">
  <div class="brand">
    <div class="brand-logo">
      <div class="brand-logo-icon">
        <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </div>
      <span class="brand-logo-name">网址收藏夹</span>
    </div>
    <h1 class="brand-title">你的书签，<br><em>随时随地</em></h1>
    <p class="brand-desc">收藏整理你喜欢的网址，支持多用户、浏览器同步、8 种展示模板。</p>
    <div class="brand-feats">
      <div class="brand-feat"><div class="feat-dot"></div>多用户权限管理</div>
      <div class="brand-feat"><div class="feat-dot"></div>Edge / Chrome 书签同步</div>
      <div class="brand-feat"><div class="feat-dot"></div>8 种精美展示模板</div>
    </div>
  </div>

  <div class="form-side">
    <div class="form-title">欢迎回来</div>
    <div class="form-sub">请登录您的账户</div>

    <div class="alert" id="alert"><span>⚠</span><span id="alert-text"></span></div>

    <form id="login-form" autocomplete="on">
      <div class="field">
        <label class="field-label" for="username">用户名</label>
        <div class="field-wrap">
          <span class="fi"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>
          <input class="field-input" type="text" id="username" placeholder="请输入用户名" required autocomplete="username">
        </div>
      </div>
      <div class="field">
        <label class="field-label" for="password">密码</label>
        <div class="field-wrap">
          <span class="fi"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <input class="field-input" type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
          <button type="button" class="pwd-btn" id="pwdBtn" tabindex="-1">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <label class="remember">
        <div class="cb-wrap">
          <input type="checkbox" id="remember-me">
          <div class="cb-box"><svg class="cb-check" viewBox="0 0 12 12"><polyline points="1.5,6 4.5,9.5 10.5,2.5"/></svg></div>
        </div>
        <span class="remember-lbl">记住密码</span>
      </label>
      <button type="submit" class="btn" id="login-btn">登录</button>
    </form>

    <div class="login-divider" id="fnos-divider" hidden><span>或</span></div>
    <button type="button" class="fnos-login" id="fnos-login-btn" hidden>使用飞牛 NAS 登录</button>

    <div class="links">
      <span>还没有账户？</span><a id="register-link" href="register.html">立即注册</a>
      <span class="links-sep">·</span><a href="forgot-password.html">忘记密码</a>
    </div>
  </div>
</div>

<script>
(function () {
  const THEME_KEY = 'auth_theme';
  const html = document.documentElement;

  function getSystemTheme() { return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
  function applyTheme(t) { html.setAttribute('data-theme', t || getSystemTheme()); }

  const saved = localStorage.getItem(THEME_KEY);
  applyTheme(saved);

  document.getElementById('themeBtn').addEventListener('click', function () {
    const cur = html.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem(THEME_KEY, next);
  });
})();

document.addEventListener('DOMContentLoaded', async function () {
  const form = document.getElementById('login-form');
  const btn = document.getElementById('login-btn');
  const alertEl = document.getElementById('alert');
  const alertText = document.getElementById('alert-text');
  const regLink = document.getElementById('register-link');
  const uInput = document.getElementById('username');
  const pInput = document.getElementById('password');
  const cbRemember = document.getElementById('remember-me');
  const fnosDivider = document.getElementById('fnos-divider');
  const fnosLoginButton = document.getElementById('fnos-login-btn');
  let savedFnOSGatewayURL = '';
  try {
    const candidate = new URL(localStorage.getItem('fnos_gateway_url') || '');
    if ((candidate.protocol === 'http:' || candidate.protocol === 'https:') &&
        candidate.hostname === window.location.hostname &&
        candidate.pathname.startsWith('/app/techfunway-bookmarks/')) {
      savedFnOSGatewayURL = candidate.href;
    }
  } catch (e) {}
  document.getElementById('pwdBtn').addEventListener('click', () => { pInput.type = pInput.type === 'text' ? 'password' : 'text'; });

  async function autoLogin() {
    if (new URLSearchParams(window.location.search).get('force') === '1') return false;
    const token = localStorage.getItem('token');
    if (!token) return false;
    try {
      const r = await fetch('/api/auth/me', { headers: { 'Authorization': token } });
      if (r.ok) { window.location.href = 'index.html'; return true; }
      if (r.status === 401) { localStorage.removeItem('token'); localStorage.removeItem('currentUser'); }
    } catch (e) {}
    return false;
  }

  if (await autoLogin()) return;

  function completeLogin(data) {
    localStorage.setItem('token', data.token);
    localStorage.setItem('currentUser', JSON.stringify(data.user));
    window.location.href = 'index.html';
  }

  async function tryFnOSLogin() {
    if (!window.__bookmarksFnOSURL) {
      showAlert('请从飞牛 NAS 桌面的应用入口使用一键登录');
      return false;
    }
    try {
      const r = await fetch('/api/auth/fnos/login', { method: 'POST' });
      const data = await r.json();
      if (r.ok && data.binding_required) {
        sessionStorage.setItem('fnos_username', data.fnos_username || '');
        window.location.href = 'fnos-bind.html';
        return true;
      }
      if (r.ok && data.token) {
        completeLogin(data);
        return true;
      }
      showAlert(data.error || '飞牛一键登录失败，请稍后重试');
    } catch (e) { showAlert('网络错误，请稍后重试'); }
    return false;
  }

  if (window.__bookmarksFnOSURL || savedFnOSGatewayURL) {
    fnosDivider.hidden = false;
    fnosLoginButton.hidden = false;
  }
  fnosLoginButton.addEventListener('click', async function () {
    if (!window.__bookmarksFnOSURL && savedFnOSGatewayURL) {
      window.location.href = savedFnOSGatewayURL;
      return;
    }
    fnosLoginButton.disabled = true;
    fnosLoginButton.textContent = '正在获取飞牛 NAS 登录信息…';
    await tryFnOSLogin();
    fnosLoginButton.disabled = false;
    fnosLoginButton.textContent = '使用飞牛 NAS 登录';
  });

  if (localStorage.getItem('remember_me') === 'true') {
    uInput.value = localStorage.getItem('saved_username') || '';
    pInput.value = localStorage.getItem('saved_password') || '';
    cbRemember.checked = true;
  }

  try {
    const r = await fetch('/api/config/system');
    if (r.ok) {
      const cfg = await r.json();
      if (cfg.no_users === 'true' && !window.__bookmarksFnOSURL && !savedFnOSGatewayURL) { window.location.href = 'register.html?first=1'; return; }
      if (cfg.allow_register === 'false') regLink.style.display = 'none';
      if (cfg.require_login === 'false' && !new URLSearchParams(window.location.search).get('force')) {
        window.location.href = 'index.html'; return;
      }
    }
  } catch (e) {}

  function showAlert(msg) {
    alertText.textContent = msg; alertEl.classList.add('show');
    setTimeout(() => alertEl.classList.remove('show'), 5000);
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const username = uInput.value.trim(), password = pInput.value;
    if (!username || !password) { showAlert('请输入用户名和密码'); return; }
    btn.disabled = true; btn.textContent = '登录中…';
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password: MD5(password) })
      });
      const data = await r.json();
      if (r.ok) {
        if (cbRemember.checked) {
          localStorage.setItem('saved_username', username);
          localStorage.setItem('saved_password', password);
          localStorage.setItem('remember_me', 'true');
        } else {
          localStorage.removeItem('saved_username'); localStorage.removeItem('saved_password');
          localStorage.setItem('remember_me', 'false');
        }
        completeLogin(data);
      } else { showAlert(data.error || '登录失败，请检查用户名和密码'); }
    } catch (e) { showAlert('网络错误，请稍后重试'); }
    finally { btn.disabled = false; btn.textContent = '登录'; }
  });
});
</script>
</body>
</html>
